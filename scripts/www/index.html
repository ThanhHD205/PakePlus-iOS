  <style>
/* styles.css — Khung đơn + giao diện tĩnh G1 cho Tiệm Yuumi.
   Hệ màu theo theme: #app-frame[data-theme="..."] đổi các biến --accent/--bg/... (12 màu, REFERENCE F10). */

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  display: flex;
  justify-content: center;
  background: #e7ddd2; /* nền trơn ngoài khung */
  /* P2: font Baloo 2 (Google Fonts, display=swap) + fallback system-ui/rounded. */
  font-family: "Baloo 2", "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; touch-action: manipulation; cursor: pointer; }
svg { display: block; max-width: 100%; }

/* ---------- Khung đơn ---------- */
#app-frame {
  /* Mặc định = Hồng dâu (theme mặc định, F10) */
  --accent: #ef5d8f;
  --accent-strong: #b63463;
  --accent-soft: #fde3ec;
  --bg: #fdf1e6;
  --surface: #fffaf2;
  --ink: #4a3226;
  --counter-bg: #f7e8d3;
  /* Bộ biến ngữ nghĩa (P0-1): MỌI theme phải định nghĩa đủ 10 biến này — e2e upgrade2-check
     kiểm bằng getComputedStyle. Theme sáng dùng chung bộ mặc định dưới đây; theme có accent
     nhạt/đậm đặc biệt (kem-sua, vang-chanh, dem-diu...) ghi đè --on-accent cho đủ tương phản.
     v1.12.0: --on-accent chỉ còn MỘT khai báo duy nhất ở đây (trước đây khai báo 2 lần
     trong cùng khối — dòng #2b0f1e ở đầu bị dòng #ffffff ở dưới ghi đè lặng lẽ) và CẢ 12
     theme đều khai báo tường minh --on-accent của riêng mình bên dưới, không theme nào
     phụ thuộc vào giá trị "rò" từ khối gốc hay theme khác. */
  --text-main: #4a3226;
  --text-soft: #7d6350;
  --surface-soft: #fde3ec;
  --surface-muted: #e9dfd2;
  --border-soft: #ecd9c2;
  --border: #c99b62;
  --on-accent: #2b0f1e; /* khớp theme mặc định hong-dau: chữ tối trên accent hồng sáng */
  --good: #3f7d24;
  --warn: #c0392b;
  --overlay-bg: rgba(60, 35, 25, .45);

  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh; /* B11 (v1.10.0): fallback cho trình duyệt chưa có dvh */
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
}
#app-frame[data-theme="kem-sua"] { --accent: #f2a0b5; --accent-strong: #a55169; --accent-soft: #fdf0e2; --bg: #fdf6ea; --surface-soft: #fdf0e2; --on-accent: #5b2333; }
#app-frame[data-theme="nau-ca-phe"] { --accent: #9b6b3a; --accent-strong: #8a5a2b; --accent-soft: #f1e4cf; --bg: #f8efe0; --counter-bg: #efdfc6; --surface-soft: #f1e4cf; --on-accent: #ffffff; }
#app-frame[data-theme="so-co-la"] { --accent: #6b4226; --accent-strong: #54331c; --accent-soft: #ead9c2; --bg: #f6ecdb; --counter-bg: #eddcbf; --surface-soft: #ead9c2; --on-accent: #ffffff; }
#app-frame[data-theme="hong-dau"] { --accent: #ef5d8f; --on-accent: #2b0f1e; --accent-strong: #b63463; --accent-soft: #fde3ec; --bg: #fdf1e6; --surface-soft: #fde3ec; }
#app-frame[data-theme="cam-dao"] { --accent: #f59a52; --accent-strong: #9b5720; --accent-soft: #fdeeda; --bg: #fdf3e6; --surface-soft: #fdeeda; --on-accent: #572e05; }
#app-frame[data-theme="tra-thai"] { --accent: #e87f1e; --accent-strong: #a5540b; --accent-soft: #fcebd3; --bg: #fdf3e2; --surface-soft: #fcebd3; --on-accent: #2b0f1e; }
#app-frame[data-theme="vang-chanh"] { --accent: #d9a91e; --accent-strong: #86640b; --accent-soft: #faf3cd; --bg: #fcf8e8; --counter-bg: #f3ecca; --surface-soft: #faf3cd; --on-accent: #43300a; }
#app-frame[data-theme="xanh-matcha"] { --accent: #58a447; --on-accent: #2b0f1e; --accent-strong: #3a752e; --accent-soft: #e6f2da; --bg: #f4f8ec; --counter-bg: #e9efdb; --surface-soft: #e6f2da; }
#app-frame[data-theme="bac-ha"] { --accent: #2fae9b; --on-accent: #2b0f1e; --accent-strong: #1a7568; --accent-soft: #dcf3ee; --bg: #effaf7; --counter-bg: #e2efe6; --surface-soft: #dcf3ee; }
#app-frame[data-theme="xanh-bien"] { --accent: #3d8fd1; --on-accent: #2b0f1e; --accent-strong: #2a6ea6; --accent-soft: #e0effa; --bg: #eff7fd; --counter-bg: #e6ecdf; --surface-soft: #e0effa; }
#app-frame[data-theme="tim-khoai-mon"] { --accent: #8a5fc1; --accent-strong: #7448ab; --accent-soft: #eee4fa; --bg: #f7f2fc; --surface-soft: #eee4fa; --on-accent: #ffffff; }
#app-frame[data-theme="dem-diu"] {
  --accent: #f2a7bd; --accent-strong: #ffc7d6; --accent-soft: #55455e;
  --bg: #332a38; --surface: #463a4d; --ink: #f7ead9; --counter-bg: #3d3244;
  /* Theme tối: chữ chính sáng, on-accent TỐI vì accent hồng nhạt (chữ trắng sẽ chìm). */
  --text-main: #f7ead9; --text-soft: #cdbfd4; --surface-soft: #55455e; --surface-muted: #3a3040;
  --border-soft: #574a63; --border: #7a6489; --on-accent: #4a2436;
  --good: #9ccc7a; --warn: #f2a49a; --overlay-bg: rgba(10, 6, 14, .55);
}

/* ---------- Phần đầu cố định (không cuộn) ---------- */
.fixed-head { flex: 0 0 auto; background: var(--bg); z-index: 5; }

/* (A) Thanh trên */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: max(8px, env(safe-area-inset-top)) 10px 6px;
}
.btn-pause {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid #fff; background: var(--accent);
  box-shadow: 0 2px 6px rgba(90, 55, 30, .25);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.btn-pause svg { width: 20px; height: 20px; }
/* Nút loa bật/tắt tiếng (G7) — cạnh cụm ngày/đồng hồ trên thanh trên */
.btn-sound {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid #fff; background: var(--accent-strong);
  box-shadow: 0 2px 6px rgba(90, 55, 30, .22);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.btn-sound svg { width: 19px; height: 19px; }
.topbar-left { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.day-label { font-weight: 800; font-size: 17px; line-height: 1.25; white-space: nowrap; }
.clock-label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--accent-strong); font-weight: 600; }
.clock-ico svg { width: 15px; height: 15px; }
.topbar-center { text-align: center; min-width: 0; flex: 1 1 auto; }
.shop-name { font-size: 12.5px; font-weight: 700; color: var(--accent-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money { font-size: 24px; font-weight: 900; line-height: 1.25; white-space: nowrap; }
.topbar-right { text-align: right; flex: 0 0 auto; }
.stars { display: inline-flex; gap: 1px; }
.star svg { width: 16px; height: 16px; }
.rating-text { font-size: 12px; font-weight: 600; white-space: nowrap; }

/* (B) Mái hiên sọc + viền lượn sóng */
.awning {
  position: relative; height: 22px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 24px, #fff7ee 24px 48px);
}
.awning::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 11px;
  background-image:
    radial-gradient(circle at 12px 0, var(--accent) 10.5px, transparent 11.5px),
    radial-gradient(circle at 36px 0, #fff7ee 10.5px, transparent 11.5px);
  background-size: 48px 11px; background-repeat: repeat-x;
}

/* (C) Hàng đợi khách */
.queue-row { display: flex; gap: 10px; padding: 16px 12px 2px; }
.queue-avatar { border: none; background: transparent; padding: 0; width: 48px; height: 48px; border-radius: 50%; }
.queue-avatar .ring {
  display: block; width: 48px; height: 48px; border-radius: 50%; padding: 3px;
  background: conic-gradient(#58b368 calc(var(--p) * 1%), #eadfce 0);
}
.queue-avatar .ring-yellow { background: conic-gradient(#f2b234 calc(var(--p) * 1%), #eadfce 0); }
.queue-avatar .ring-red { background: conic-gradient(#e05252 calc(var(--p) * 1%), #eadfce 0); }
.queue-avatar .ring svg { width: 100%; height: 100%; border-radius: 50%; background: #fff3e2; }
.queue-avatar.selected { box-shadow: 0 0 0 3px var(--accent); }

/* (D) Khách + bong bóng đơn */
.customer-area { display: flex; gap: 8px; padding: 4px 10px 8px; align-items: flex-start; }
.customer-figure { flex: 0 0 92px; }
.customer-figure svg { width: 100%; height: auto; }
.speech-bubble {
  position: relative; flex: 1 1 auto; min-width: 0;
  background: var(--surface); border: 2px solid #e8cdb4; border-radius: 16px;
  padding: 8px 10px;
  display: grid; grid-template-columns: 36px 1fr; column-gap: 8px;
}
.speech-bubble::before {
  content: ""; position: absolute; left: -9px; top: 34px;
  border: 5px solid transparent; border-right: 6px solid #e8cdb4;
}
.bubble-cup { grid-row: 1 / span 2; }
.bubble-cup svg { width: 34px; height: auto; }
.order-text { margin: 0; font-size: 13.5px; line-height: 1.35; }
.order-text strong { color: var(--accent-strong); }
/* v1.5.0: dòng từng ly trong bong bóng ĐƠN NHIỀU LY — ly xong mờ + ✓, ly đang làm nổi nền. */
.cup-lines { display: flex; flex-direction: column; gap: 3px; }
.cup-line { margin: 0; }
.cup-line .cup-tag { font-weight: 800; white-space: nowrap; }
.cup-line-done { opacity: .55; }
.cup-line-current { background: var(--accent-soft); border-radius: 8px; padding: 2px 6px; margin-left: -6px; margin-right: -6px; }
.patience-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.patience-label { font-size: 12px; font-weight: 800; letter-spacing: .4px; white-space: nowrap; }
.patience-track { flex: 1; height: 10px; border-radius: 6px; background: #efe3d0; overflow: hidden; }
.patience-fill { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #f7b731, #f2994a); }

/* ---------- Vùng cuộn duy nhất: quầy pha ---------- */
.counter-scroll {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background-color: var(--counter-bg);
  /* P2: đường kệ gỗ ngang chạy dọc quầy. */
  background-image: repeating-linear-gradient(0deg, transparent 0 118px, rgba(138, 90, 59, .13) 118px 121px);
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}
.counter-section { padding: 8px 10px 4px; }
.wood-label {
  display: inline-block; padding: 5px 14px;
  background: linear-gradient(#dda763, #cd9250);
  border: 2px solid #b57e42; border-radius: 8px;
  color: #5d3a1a; font-weight: 800; font-size: 13px; letter-spacing: .5px;
}
.badge {
  position: absolute; top: 2px; right: 2px; z-index: 2;
  min-width: 20px; height: 20px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  background: #fff3d6; border: 1.5px solid #d9a441; border-radius: 999px;
  color: #7a4b12; font-size: 12px; font-weight: 800;
}
.hint { border-color: var(--accent) !important; box-shadow: 0 0 0 2px var(--accent); }

/* (E)+(F) Hàng trà — v1.4.0: bố cục lại để MỌI vùng chạm >= 44px ngang ở cả 360px:
   cột trái = 2 chồng ly XẾP DỌC (M trên L), giữa = 6 bình trà lưới 3 cột x 2 hàng,
   cột phải = máy dán nắp. Trước đây 1 hàng ngang: bình chỉ rộng 33-38px, chồng ly 26px. */
.tea-row { display: grid; grid-template-columns: 50px 1fr 54px; gap: 6px; align-items: end; margin-top: 6px; }
.cup-stacks { display: flex; flex-direction: column; gap: 4px; }
.cup-stack { position: relative; width: 100%; border: none; background: transparent; padding: 0; min-height: 44px; }
.cup-stack svg { width: auto; height: 42px; display: block; margin: 0 auto; }
.cup-size { display: block; text-align: center; font-weight: 800; font-size: 12px; color: #7a5a36; background: #fff8ec; border-radius: 6px; padding: 1px 0; margin: 0 2px; }
.jar-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; min-width: 0; }
.tea-row > * { min-width: 0; }
.tea-jar {
  position: relative; min-height: 70px; padding: 3px 1px 4px; min-width: 0; overflow: visible;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background: #fff8ec; border: 2px solid #e2cdb2; border-radius: 10px;
  /* P0-2 (iOS): giữ bình rót không được chọn chữ / hiện menu cảm ứng / cuộn trang theo tay. */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.jar-art svg { display: block; } /* kích thước art bình do rule .jar-art/.jar-art svg ở cuối file quyết định (trùng selector, rule sau thắng) */
.jar-label { font-size: 12px; font-weight: 700; line-height: 1.25; text-align: center; color: #5d3a1a; width: 100%; letter-spacing: -.5px; transform: scaleX(.84); white-space: nowrap; }
.sealer { position: relative; border: none; background: transparent; padding: 0; min-height: 44px; }
.sealer-art { display: block; position: relative; z-index: 0; }
.sealer-art svg { width: 100%; height: auto; max-height: 88px; margin: 0 auto; }
/* v1.4.0: nhãn trạng thái là DẢI full-width trong cột máy (mép ở toạ độ nguyên, không còn
   translateX(-50%) lệch nửa pixel gây viền màu ở chữ) + z-index cao nhất trong nút máy để
   hình máy không bao giờ chồng lên chữ; thêm border/shadow cho mép nhãn nét, chữ trắng đều. */
.ready-light {
  position: absolute; top: 57%; left: 3px; right: 3px; z-index: 3; text-align: center;
  background: #2e7d3a; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .3px;
  padding: 1.5px 2px; border: 1.5px solid #256b31; border-radius: 3px; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(90, 55, 20, .35);
}

/* (G)+(H)+(I) Khu pha ly */
.brew-head { display: flex; justify-content: space-between; align-items: flex-end; }
.bin { width: 46px; border: none; background: transparent; padding: 0; min-height: 44px; }
.bin svg { width: 100%; height: auto; }
.brew-grid { display: grid; grid-template-columns: 118px 1fr; gap: 8px; margin-top: 6px; }
.board {
  width: 100%; min-height: 118px; padding: 8px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  background: linear-gradient(160deg, #eec38c, #e0af6d);
  border: 2px solid #b57e42; border-radius: 12px;
}
.board-text { margin-top: 20px; text-align: center; font-weight: 700; font-size: 13.5px; color: #6b3f18; }
.board-meter { position: relative; height: 10px; border-radius: 5px; background: #6b4a2a; }
/* Vùng chuẩn 90–105% trên thang hiển thị 0–130%: left = 90/130, width = 15/130 */
.meter-zone { position: absolute; top: 0; bottom: 0; left: 69.23%; width: 11.54%; background: #7ec850; }
.meter-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px 0 0 5px; background: #f2b234; }
.meter-fill-dat { background: #7ec850; }
.meter-fill-tran { background: #e05252; }
.meter-needle { position: absolute; top: -3px; left: 0; width: 8px; height: 16px; margin-left: -4px; background: #fff; border: 1.6px solid #8a5a3d; border-radius: 2px; }
/* G2: ly hiện tại trên thớt */
.board-main { display: flex; gap: 8px; align-items: stretch; }
.board-cup {
  position: relative; flex: 0 0 34px; height: 62px; overflow: hidden;
  border: 2px solid #8a5a3d; border-top-width: 3px; border-radius: 3px 3px 8px 8px;
  background: rgba(255, 250, 242, .65);
}
.board-cup-liquid { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height .05s linear; }
.board-cup-lid { position: absolute; top: 0; left: 0; right: 0; height: 7px; background: var(--accent); border-bottom: 2px solid #8a5a3d; }
.board-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.board-cup-name { font-weight: 800; font-size: 12.5px; color: #7a4b21; line-height: 1.2; }
.board-pct { font-weight: 900; font-size: 19px; color: #5d3a1a; line-height: 1.1; }
.board-class { font-size: 12px; font-weight: 800; }
.board-class-thieu { color: #b8860b; }
.board-class-dat { color: #3f7d24; }
.board-class-tran { color: #c0392b; }
.board-extras { font-size: 12px; color: #7a4b21; line-height: 1.3; }
.board-actions { display: flex; gap: 6px; }
.board-btn {
  flex: 1; min-height: 36px; padding: 4px 6px;
  background: #fff3d6; border: 2px solid #b57e42; border-radius: 9px;
  font-weight: 800; font-size: 13px; color: #7a4b21;
}
.board-btn-serve { background: var(--accent); border-color: var(--accent-strong); color: var(--on-accent); }
.cup-stack.selected { box-shadow: 0 0 0 2px var(--accent); border-radius: 10px; }
.tea-jar.pouring { border-color: var(--accent-strong); box-shadow: 0 0 0 2px var(--accent-soft); }
.topping-cell.in-cup, .flavor-bottle.in-cup { box-shadow: inset 0 0 0 2px #7ec850; border-radius: 10px; }
.ready-light.is-sealed { background: #e8913a; }
.count-badge {
  position: absolute; top: 2px; left: 2px; z-index: 2;
  min-width: 21px; height: 19px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); border: 1.5px solid #fff; border-radius: 9px;
  color: var(--on-accent); font-size: 12px; font-weight: 800;
}
.mini-box { position: relative; }

/* G2: toast trong khung + rung khi thao tác sai */
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 8px); z-index: 60;
  max-width: calc(100% - 32px); padding: 9px 16px;
  background: rgba(74, 50, 38, .94); color: #fff7ee; border-radius: 999px;
  font-size: 13.5px; font-weight: 700; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes shake-x {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
.shake { animation: shake-x .18s ease-in-out 2; }
.ice-sugar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.mini-box {
  min-height: 64px; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: #fff8ec; border: 2px solid #e2cdb2; border-radius: 10px;
}
.mini-art svg { height: 30px; width: auto; }
.mini-label { font-size: 12px; font-weight: 800; text-align: center; line-height: 1.4; color: #5d3a1a; }
.brew-grid > * { min-width: 0; }
.topping-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.topping-cell {
  position: relative; aspect-ratio: 1 / 1; padding: 3px; min-width: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #eef0ee; border: 2px solid #cfd4cf; border-radius: 10px;
}
.topping-art { display: block; width: 100%; min-width: 0; }
.topping-art svg { width: 100%; height: auto; display: block; }
.topping-cell.locked { background: #e8e2d6; opacity: .8; }
.lock-ico svg { width: 22px; height: 22px; opacity: .85; }

/* (J) Kệ chai hương */
.flavor-section { padding-top: 10px; }
.flavor-shelf {
  display: flex; gap: 8px; padding: 10px 10px 4px;
  background: linear-gradient(#ecd09e, #dcb87e);
  border-top: 6px solid #b57e42; border-radius: 6px;
}
.flavor-bottle { position: relative; width: 52px; border: none; background: transparent; padding: 0; min-height: 44px; }
.bottle-art svg { height: 80px; width: auto; margin: 0 auto; }
/* (v1.8.0: .bottle-name đã xoá — chai hương không còn chữ tên, chỉ hình trái cây) */

/* ---------- Popup Màu giao diện (trong khung) ---------- */
.theme-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(60, 35, 25, .45);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.theme-overlay[hidden] { display: none; }
.theme-card {
  width: 100%; background: var(--surface); color: var(--ink);
  border-radius: 22px; padding: 18px 14px 14px;
  box-shadow: 0 12px 32px rgba(60, 35, 25, .35);
}
.theme-title { margin: 0; text-align: center; font-size: 21px; font-weight: 900; }
.theme-desc { margin: 6px 0 0; text-align: center; font-size: 13.5px; }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.theme-option {
  min-height: 66px; padding: 8px 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent-soft); border: 2.5px solid transparent; border-radius: 14px; color: var(--ink);
}
.theme-option.selected { border-color: var(--accent); }
.theme-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(90, 55, 30, .3); }
.theme-name { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.15; }
.theme-done {
  width: 100%; min-height: 48px;
  background: var(--accent); color: var(--on-accent); border: none; border-radius: 14px;
  font-size: 16px; font-weight: 800;
}

/* ---------- Style dùng NGOÀI panel kết quả (P0-1): tiêu đề nhóm + khối phản hồi ---------- */
.sheet-group-title {
  font-size: 13.5px; font-weight: 800; color: var(--accent-strong);
  margin: 12px 0 4px; letter-spacing: .2px;
}
.rv-label {
  font-size: 12px; font-weight: 800; letter-spacing: .4px; opacity: .75; text-transform: uppercase;
}
.rv-reply {
  margin-top: 4px; padding: 6px 9px; background: var(--accent-soft);
  border-radius: 10px; font-size: 12.5px; color: var(--text-main);
}

/* Kết quả framecheck (chỉ xuất hiện khi ?framecheck=1) */
#frame-results {
  position: fixed; left: 0; bottom: 0; z-index: 999;
  max-width: 100vw; margin: 0; padding: 6px;
  background: #fff; color: #111; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
}

button:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 1px; }

/* ---------- G3: phiên phục vụ — tên khách, công tắc gợi ý, nút hủy, màu thanh kiên nhẫn, panel kết quả ---------- */
.bubble-main { min-width: 0; }
.bubble-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.customer-name { font-size: 12.5px; font-weight: 800; color: var(--accent-strong); white-space: nowrap; }
.hint-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; cursor: pointer; min-height: 48px; }
.hint-toggle input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.queue-empty { align-items: center; font-size: 12.5px; font-weight: 700; opacity: .65; }
.patience-fill.pf-green { background: linear-gradient(90deg, #58b368, #7ec850); }
.patience-fill.pf-yellow { background: linear-gradient(90deg, #f7b731, #f2994a); }
.patience-fill.pf-red { background: linear-gradient(90deg, #e05252, #e07a52); }

/* ================= Vòng lặp ngày (G5) ================= */
#view-root {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.phase-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 10px 14px;
}
.phase-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text-main);
  margin: 6px 0 8px;
}
/* Màn chào */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.welcome-art {
  width: 252px;
  height: 158px;
  margin-top: 10px;
}
.welcome-art svg {
  width: 100%;
  height: 100%;
}
.welcome-title {
  font-size: 30px;
  font-weight: 800;
  color: var(--accent-strong);
  margin: 4px 0 2px;
}
.welcome-tagline {
  font-size: 13px;
  color: var(--text-soft);
  margin: 0 0 6px;
}
.welcome-status {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  background: var(--surface-soft);
  border: 1.5px solid var(--border-soft);
  border-radius: 999px;
  padding: 4px 12px;
  margin: 4px 0 10px;
}
.welcome-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 280px;
  margin-top: 8px;
}
.big-btn {
  min-height: 48px;
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  padding: 10px 14px;
  cursor: pointer;
}
.big-btn-soft {
  background: var(--surface-soft);
  color: var(--text-main);
  border-color: var(--border-soft);
}
.big-btn:disabled {
  background: var(--surface-muted);
  color: var(--text-soft);
  border-color: var(--border-soft);
  cursor: not-allowed;
}
.confirm-box {
  width: 100%;
  max-width: 320px;
  margin-top: 12px;
  background: var(--surface);
  border: 2px solid var(--border-soft);
  border-radius: 14px;
  padding: 10px 12px;
  text-align: left;
}
.confirm-title {
  font-weight: 800;
  font-size: 14px;
  color: var(--text-main);
}
.confirm-text {
  font-size: 12.5px;
  color: var(--text-soft);
  margin: 4px 0 8px;
}
.confirm-actions {
  display: flex;
  gap: 8px;
}
.confirm-actions .sheet-btn {
  flex: 1;
}
/* Pha Chuẩn bị */
.prep-block {
  margin-bottom: 10px;
}
.goal-line {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-main);
}
.goal-ok {
  color: var(--good);
}
.goal-miss {
  color: var(--warn);
}
.prep-tabs {
  flex: 0 0 auto;
  display: flex;
  gap: 4px;
  padding: 6px 8px 0;
  background: var(--bg);
}
.prep-cta {
  flex: 0 0 auto;
  padding: 8px 10px 10px;
  background: var(--bg);
}
.prep-cta .big-btn {
  width: 100%;
}
.cta-reason {
  font-size: 12px;
  color: var(--warn);
  font-weight: 700;
  text-align: center;
  margin-top: 4px;
}
/* Tạm dừng */
.pause-overlay {
  position: absolute;
  inset: 0;
  z-index: 58;
  background: var(--overlay-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.pause-overlay[hidden] {
  display: none;
}
.pause-card {
  background: var(--surface);
  border: 2.5px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  width: 100%;
  max-width: 280px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: center;
}
/* Tổng kết ngày + đánh giá */
.summary-scroll .big-btn {
  width: 100%;
  margin-top: 12px;
}
.review-row {
  border-bottom: 1px dashed var(--border-soft);
  padding: 6px 0;
}
.review-row:last-child {
  border-bottom: none;
}
.review-row-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.review-day {
  font-size: 12px;
  color: var(--text-soft);
  font-weight: 700;
}
.review-stars {
  margin: 2px 0;
}
.review-text {
  font-size: 12.5px;
  color: var(--text-main);
}
.review-reply {
  font-size: 11.5px;
  color: var(--text-soft);
  font-style: italic;
  margin-top: 2px;
}
.star-sm svg {
  width: 13px;
  height: 13px;
}
.owned-badge {
  font-size: 11px;
  font-weight: 800;
  color: var(--good);
  border: 1.5px solid var(--good);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.upgrade-row {
  align-items: center;
}

.result-panel {
  position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 55;
  background: var(--surface); border: 2px solid #e8cdb4; border-radius: 16px;
  padding: 12px 14px; box-shadow: 0 12px 32px rgba(90, 55, 20, .28);
}
.result-panel[hidden] { display: none; }
.result-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.result-title { font-size: 14px; font-weight: 800; }
.result-close {
  border: none; background: var(--accent-soft); color: var(--accent-strong);
  font-size: 12px; font-weight: 800; border-radius: 999px; padding: 5px 14px; min-height: 44px;
}
.result-stars { display: flex; gap: 2px; margin: 6px 0 2px; }
.result-stars .star svg { width: 22px; height: 22px; }
.result-reasons { margin: 4px 0; font-size: 12.5px; font-weight: 700; color: #c0442f; }
.result-money { font-size: 16px; font-weight: 900; margin: 4px 0; }
.result-money .tip-part { color: #428534; font-size: 13px; font-weight: 800; }
.result-review { margin-top: 6px; font-size: 13px; line-height: 1.45; }
.result-review .rv-label { font-size: 10.5px; font-weight: 800; letter-spacing: .4px; opacity: .6; text-transform: uppercase; }
.result-review .rv-reply { margin-top: 4px; padding: 6px 9px; background: var(--accent-soft); border-radius: 10px; }
.speech-bubble--wide { grid-template-columns: 1fr; }

/* ---------- G4: hàng tab quản lý + bottom sheet Kho / Giá bán / Tổng kết ---------- */
.sheet-tabs {
  flex: 0 0 auto; display: flex; gap: 8px; padding: 6px 10px 2px; background: var(--bg); z-index: 5;
}
.sheet-tab {
  flex: 1; min-height: 38px; border: 2px solid #e8cdb4; border-radius: 999px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 800;
}
.sheet-tab.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.sheet-overlay {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(60, 35, 25, .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-overlay[hidden] { display: none; }
.sheet-card {
  width: 100%; max-height: 84%; display: flex; flex-direction: column;
  background: var(--surface); color: var(--ink);
  border-radius: 22px 22px 0 0; padding: 14px 14px calc(12px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 30px rgba(60, 35, 25, .3);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sheet-title { margin: 0; font-size: 19px; font-weight: 900; }
.sheet-close {
  border: none; background: var(--accent-soft); color: var(--accent-strong);
  font-size: 13px; font-weight: 800; border-radius: 999px; padding: 7px 14px; min-height: 36px;
}
.sheet-body { overflow-y: auto; overflow-x: hidden; min-height: 0; }
.sheet-subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sheet-subtab {
  flex: 1 1 21%; min-height: 36px; border: 2px solid transparent; border-radius: 999px;
  background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 800;
}
.sheet-subtab.active { background: var(--accent); color: var(--on-accent); }
.sheet-rows { display: flex; flex-direction: column; }
.sheet-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 2px; border-bottom: 1px dashed #ecd9c2;
}
.sheet-row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sheet-row-name { font-size: 14.5px; font-weight: 800; }
.sheet-row-meta { font-size: 12px; opacity: .75; font-weight: 600; }
.sheet-empty { padding: 14px 4px; font-size: 13.5px; font-weight: 700; opacity: .65; }
.stepper { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; }
.step-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e8cdb4;
  background: var(--surface); color: var(--accent-strong); font-size: 18px; font-weight: 900; line-height: 1.25;
  display: inline-flex; align-items: center; justify-content: center;
}
.step-qty { min-width: 34px; text-align: center; font-size: 15px; font-weight: 900; }
.sheet-foot {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
}
.sheet-total { flex: 1; font-size: 15px; font-weight: 900; }
.sheet-btn {
  min-height: 46px; padding: 0 18px; border: none; border-radius: 14px;
  background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 800;
}
.sheet-btn-soft { background: var(--accent-soft); color: var(--accent-strong); }
.sum-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 7px 2px; border-bottom: 1px dashed #ecd9c2; font-size: 14px; font-weight: 600;
}
.sum-row .sum-val { font-weight: 900; white-space: nowrap; }
.sum-row.wrap { flex-wrap: wrap; }
.sum-row.wrap > span:first-child { flex: 0 0 auto; }
.sum-row.wrap .sum-val { white-space: normal; text-align: right; margin-left: auto; max-width: 100%; overflow-wrap: break-word; }
.sum-row.sum-total { border-bottom: none; font-size: 16px; font-weight: 900; padding-top: 10px; }
.sum-note { font-size: 12px; opacity: .7; font-weight: 600; padding: 2px 2px 6px; }

/* ================= G6 — Mở rộng ================= */
/* Nút mua mờ khi chưa đủ tiền (vẫn bấm được để hiện toast) */
.sheet-btn.cant-afford { opacity: .45; }
/* Nhãn ONLINE trên avatar hàng đợi + bong bóng đơn */
.queue-avatar { position: relative; }
.online-badge {
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  background: #20724e; color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .4px;
  vertical-align: middle;
}
.queue-avatar .online-badge { position: absolute; right: -4px; bottom: -2px; }
/* Chip thời tiết trên thanh trên của pha phục vụ */
.weather-label { font-size: 12px; font-weight: 800; color: var(--accent-strong); }
/* Khối vay vốn */
.loan-block { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.loan-btn { width: 100%; }
/* Màn Sang tiệm */
.gameover { text-align: center; padding-top: 48px; }
.gameover .big-btn { margin-top: 18px; }
/* Trang trí (data-deco-* trên #app-frame) — mái hiên */
#app-frame[data-deco-maihien="xanh"] .awning {
  background: repeating-linear-gradient(90deg, #57b08a 0 24px, #f2fbf6 24px 48px);
}
#app-frame[data-deco-maihien="xanh"] .awning::after {
  background-image:
    radial-gradient(circle at 12px 0, #57b08a 10.5px, transparent 11.5px),
    radial-gradient(circle at 36px 0, #f2fbf6 10.5px, transparent 11.5px);
}
#app-frame[data-deco-maihien="hoa"] .awning {
  background: repeating-linear-gradient(90deg, #e58bb1 0 24px, #fdeef5 24px 48px);
}
#app-frame[data-deco-maihien="hoa"] .awning::after {
  background-image:
    radial-gradient(circle at 12px 0, #e58bb1 10.5px, transparent 11.5px),
    radial-gradient(circle at 36px 0, #fdeef5 10.5px, transparent 11.5px);
}
/* Trang trí — tường khu khách */
#app-frame[data-deco-tuong="xanh"] .customer-area { background: #e4f2e2; border-radius: 14px; }
#app-frame[data-deco-tuong="hong"] .customer-area { background: #fbe7ef; border-radius: 14px; }
/* Trang trí — mặt quầy (tông gỗ của nhãn quầy) */
#app-frame[data-deco-matquay="godam"] .wood-label { background: #8a5a33; color: #ffe9c9; }
#app-frame[data-deco-matquay="datrang"] .wood-label { background: #e9e4da; color: #7a6a55; }
/* Trang trí — hoa văn ly trên thớt */
#app-frame[data-deco-hoavanly="chambi"] .board-cup { border-style: dotted; border-width: 3px; }
#app-frame[data-deco-hoavanly="sao"] .board-cup { border-color: #e8a13a; box-shadow: 0 0 0 2px #ffe1a3; }
/* Trang trí — biển hiệu (kiểu chữ tên tiệm) */
#app-frame[data-deco-bienhieu="led"] .shop-name,
#app-frame[data-deco-bienhieu="led"] .welcome-title { color: #ff5d8f; text-shadow: 0 0 6px #ffb3c9; letter-spacing: .5px; }
#app-frame[data-deco-bienhieu="vang"] .shop-name,
#app-frame[data-deco-bienhieu="vang"] .welcome-title { color: #b8860b; font-style: italic; }
/* Trang trí — bảng menu ở Chuẩn bị */
#app-frame[data-deco-bangmenu="trang"] .prep-block { background: #ffffff; border-radius: 14px; padding: 8px; }
#app-frame[data-deco-bangmenu="den"] .prep-block { background: #3a3a3a; border-radius: 14px; padding: 8px; color: #f5efe2; }
#app-frame[data-deco-bangmenu="den"] .prep-block .sum-row { border-bottom-color: #5a5a5a; color: #f5efe2; }
#app-frame[data-deco-bangmenu="den"] .prep-block .goal-line { color: #f5efe2; }
/* Trang trí — đèn: lớp phủ sáng ấm NHẸ chèn trong khung (P3 — bỏ filter toàn khung vì tốn
   hiệu năng và làm mờ chữ; overlay không bắt sự kiện, nằm dưới mọi popup/toast). */
.light-overlay {
  position: absolute; inset: 0; z-index: 44; pointer-events: none; background: transparent;
}
#app-frame[data-deco-den="trang"] .light-overlay { background: rgba(255, 255, 255, .07); }
#app-frame[data-deco-den="vang"] .light-overlay { background: rgba(255, 186, 73, .09); }

/* ================= G7 — Hiệu ứng chuyển động ================= */
/* Chữ tiền bay lên khi giao ly (JS tạo .fly-money trong #app-frame, tự gỡ sau 1s) */
.fly-money {
  position: absolute; z-index: 70; pointer-events: none;
  transform: translate(-50%, -100%);
  font-size: 17px; font-weight: 900; color: #2f9e44;
  text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(47, 158, 68, .35);
  animation: fly-up .95s ease-out forwards;
}
@keyframes fly-up {
  0% { opacity: 0; transform: translate(-50%, -60%) scale(.8); }
  18% { opacity: 1; transform: translate(-50%, -110%) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -230%) scale(1); }
}
/* Sao trong panel kết quả nảy lần lượt (delay đặt inline theo thứ tự sao) */
.result-stars .star { display: inline-block; }
.star-pop { animation: star-pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes star-pop {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
/* Khách mới đi vào: avatar trượt từ trái, nhân vật + bong bóng hiện dần */
.queue-avatar.enter { animation: cust-in .38s ease-out; }
.customer-figure.enter { animation: cust-in .38s ease-out; }
.speech-bubble.enter { animation: bubble-in .45s ease-out; }
@keyframes cust-in {
  /* Biên trượt giữ trong đệm trái của khu khách (10–12px) để không phần tử nào tràn khung kể cả giữa animation */
  from { transform: translateX(-8px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes bubble-in {
  from { transform: translateX(-6px) scale(.96); opacity: 0; }
  to { transform: translateX(0) scale(1); opacity: 1; }
}
/* Sắp hết kiên nhẫn (<25%): avatar rung nhẹ, vòng nhấp nháy, thanh kiên nhẫn chớp */
.queue-avatar.urgent { animation: urgent-shake .5s ease-in-out infinite; }
.queue-avatar.urgent .ring { animation: ring-blink .5s ease-in-out infinite alternate; }
@keyframes urgent-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-1.5px) rotate(-2deg); }
  75% { transform: translateX(1.5px) rotate(2deg); }
}
@keyframes ring-blink {
  from { filter: brightness(1); }
  to { filter: brightness(1.35); }
}
.patience-fill.pf-red { animation: fill-blink .55s ease-in-out infinite alternate; }
@keyframes fill-blink {
  from { opacity: 1; }
  to { opacity: .45; }
}
/* ================= Đợt sửa P0–P3 (bản 1.1.0) ================= */
/* Vùng chạm tối thiểu ~44px cho nút chính (P2) + chữ đọc được >= 12px ở nội dung thật. */
.step-btn { width: 44px; height: 44px; }
.sheet-tab { min-height: 44px; }
.sheet-subtab { min-height: 44px; }
.sheet-close { min-height: 44px; }
.board-btn { min-height: 44px; }
.btn-sound { width: 44px; height: 44px; }
.rating-text { font-size: 12px; }
.review-day { font-size: 12px; }
.patience-label { font-size: 12px; }
.weather-label { font-size: 12px; }
.theme-name { font-size: 12px; }

.board-extras { font-size: 12px; }
.board-class { font-size: 12px; }
/* Hộp Đá/Đường to hơn ~1,3x + khay topping nền inox (P2). */
.mini-box { min-height: 78px; }
.mini-art { display: block; width: 51px; max-width: 100%; margin: 0 auto; }
.mini-art svg { width: 100%; height: auto; }
.topping-grid {
  background: linear-gradient(#dfe3e7, #c6ccd2);
  border: 2px solid #a7b0b8; border-radius: 12px; padding: 6px;
}
.topping-cell { background: #f7f9fa; border-color: #b9c1c8; }
.topping-cell.locked { background: #dde1e4; }

/* Overlay Hướng dẫn (mở từ splash + màn Tạm dừng). */
.guide-overlay {
  position: absolute; inset: 0; z-index: 59;
  background: var(--overlay-bg);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.guide-overlay[hidden] { display: none; }
.guide-card {
  width: 100%; max-height: 88%; overflow-y: auto;
  background: var(--surface); color: var(--text-main);
  border: 2.5px solid var(--border); border-radius: 20px; padding: 16px;
  text-align: left;
}
.guide-card h2 { margin: 0 0 6px; font-size: 20px; font-weight: 900; text-align: center; }
.guide-card h3 { margin: 12px 0 4px; font-size: 14.5px; font-weight: 800; color: var(--accent-strong); }
.guide-card p, .guide-card li { font-size: 13px; line-height: 1.45; color: var(--text-main); }
.guide-card ul, .guide-card ol { margin: 4px 0; padding-left: 20px; }
.guide-close { width: 100%; margin-top: 12px; }

/* Splash mới (P1-D): link Hướng dẫn + số phiên bản ở góc. */
.welcome-guide-link {
  margin-top: 10px; background: none; border: none; padding: 8px 12px; min-height: 44px;
  color: var(--accent-strong); font-size: 14px; font-weight: 800; text-decoration: underline;
}
.welcome-version {
  margin-top: auto; padding-top: 14px; font-size: 12px; font-weight: 700; color: var(--text-soft);
}

/* Chuẩn bị: bảng hiệu + nút bút chì đổi tên tiệm (P1-D). */
.shop-sign {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--surface); border: 2px solid var(--border-soft); border-radius: 14px;
  padding: 8px 12px; margin-bottom: 10px;
}
.shop-sign-name { font-size: 16px; font-weight: 900; color: var(--text-main); overflow-wrap: break-word; }
.shop-sign-label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
.rename-btn {
  flex: 0 0 auto; min-width: 44px; min-height: 44px; border-radius: 12px;
  border: 2px solid var(--border-soft); background: var(--surface-soft);
  font-size: 17px; cursor: pointer;
}
.rename-box { display: flex; gap: 6px; margin-bottom: 10px; }
.rename-input {
  flex: 1; min-width: 0; min-height: 44px; padding: 8px 10px;
  border: 2px solid var(--border); border-radius: 12px;
  /* B5 (v1.10.0): >=16px để iOS Safari không tự zoom khi focus ô nhập. */
  font: inherit; font-size: 16px; font-weight: 700; color: var(--text-main); background: var(--surface);
}

/* Banner cạn tiền ở Chuẩn bị (P0-12). */
.low-money-banner {
  border: 2.5px solid var(--warn); background: #fdf0ec; color: #7c2415;
  border-radius: 14px; padding: 10px 12px; margin-bottom: 10px;
}
#app-frame[data-theme="dem-diu"] .low-money-banner { background: #4a3038; color: #ffd9d2; }
.low-money-title { font-size: 15px; font-weight: 900; }
.low-money-text { font-size: 13px; margin: 3px 0 8px; line-height: 1.4; }
.low-money-banner .big-btn { width: 100%; }

/* Menu hôm nay = bảng phấn xanh 2 cột (P2). */
.menu-chalk {
  background: #2e5d4b; border: 3px solid #8a5a3b; border-radius: 14px; padding: 10px 12px;
  color: #f5efe2;
}
.menu-chalk .sheet-group-title { color: #ffe9a8; margin-top: 8px; }
.menu-chalk .sheet-group-title:first-child { margin-top: 0; }
.menu-chalk .sum-row { border-bottom-color: rgba(255, 255, 255, .28); color: #f5efe2; }
.menu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }

/* Dòng gợi ý nhập hàng ở đầu tab Kho (P1-C) + chip điện trang bị (P1-E). */
.restock-hint {
  font-size: 12.5px; font-weight: 700; color: var(--accent-strong);
  background: var(--accent-soft); border-radius: 10px; padding: 7px 10px; margin-bottom: 10px;
  line-height: 1.4;
}
.elec-chip {
  display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
  background: #fff3bf; color: #7a5b00; font-size: 12px; font-weight: 800; white-space: nowrap;
}
/* Ô nhập giá trực tiếp ở tab Giá bán (P1-F). */
.price-input {
  width: 76px; min-height: 44px; padding: 6px 8px; text-align: center;
  border: 2px solid var(--border-soft); border-radius: 10px;
  /* B5 (v1.10.0): >=16px chống iOS tự zoom khi focus. */
  font: inherit; font-size: 16px; font-weight: 800; color: var(--text-main); background: var(--surface);
}
.price-hint {
  font-size: 12.5px; font-weight: 700; color: var(--accent-strong);
  background: var(--accent-soft); border-radius: 10px; padding: 7px 10px; margin-bottom: 10px;
}

/* Tab Đánh giá giàu ngữ cảnh (P1-B): avatar skin + miniCup + sao đỏ khi <= 2 sao. */
.review-row-rich { display: flex; gap: 9px; }
.review-avatar { flex: 0 0 44px; }
.review-avatar svg { width: 44px; height: 44px; border-radius: 50%; }
.review-main { flex: 1; min-width: 0; }
.review-cup { flex: 0 0 34px; }
.review-cup svg { width: 32px; height: auto; }
.review-stars-low .star svg { filter: hue-rotate(-38deg) saturate(2.4); }
.review-name-low { color: #c0392b !important; }
.reply-edit-box { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.reply-input {
  width: 100%; min-height: 44px; padding: 8px 10px; resize: vertical;
  border: 2px solid var(--border); border-radius: 10px;
  /* B5 (v1.10.0): >=16px chống iOS tự zoom khi focus. */
  font: inherit; font-size: 16px; color: var(--text-main); background: var(--surface);
}
.reply-edit-actions { display: flex; gap: 6px; }
.reply-edit-actions .sheet-btn { flex: 1; min-height: 44px; }
.reply-edit-link {
  background: none; border: none; padding: 4px 2px; min-height: 44px; display: inline-flex; align-items: center;
  color: var(--accent-strong); font-size: 12.5px; font-weight: 800; text-decoration: underline; cursor: pointer;
}

/* Tôn trọng lựa chọn giảm chuyển động của hệ điều hành: tắt mọi animation/transition trong khung */
@media (prefers-reduced-motion: reduce) {
  #app-frame *, #app-frame *::before, #app-frame *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- Đợt ATCD (v1.2.0): phần tử UI tối thiểu cho chức năng mới ---------- */
/* A6: kệ hương cuộn ngang để bấm được chai cuối (chai giữ nguyên 52px). */
.flavor-shelf { overflow-x: auto; }
.flavor-bottle { flex: 0 0 auto; }
/* A9: panel kết quả thành toast không chặn chạm (trừ nút Đóng). */
.result-panel { pointer-events: none; }
.result-close { pointer-events: auto; }
/* A2d: trạng thái tồn kho ở quầy — xám khi HẾT + nhãn HẾT / sắp hết. */
.is-oos { filter: grayscale(.85); opacity: .55; }
.stock-tag {
  position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 999px;
  background: #b03a3a; color: #fff; white-space: nowrap; z-index: 2;
}
.stock-tag.low { background: #d9a441; }
/* A2b: tag HẾT trên bong bóng đơn + nút xin lỗi / từ chối (>= 44px, tách xa công tắc Gợi ý). */
.oos-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.oos-item { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.oos-tag { background: #b03a3a; color: #fff; font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 999px; }
.bubble-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.reject-btn, .oos-apologize-btn {
  min-height: 46px; padding: 9px 14px; border-radius: 999px; cursor: pointer;
  font-size: 13px; font-weight: 800; border: 2px solid var(--border, #e8cdb4);
  background: var(--surface); color: var(--text);
}
.oos-apologize-btn { background: #b03a3a; border-color: #b03a3a; color: #fff; }
/* A3a: nút Đóng cửa — đợt UI đã gộp vào thanh trên (.btn-close-shop), xem khối v1.3.0. */
/* Hộp xác nhận dùng chung (đóng cửa / nghỉ bán / từ chối / bỏ qua hướng dẫn / hết hàng). */
.confirm-overlay {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(60, 35, 25, .45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.confirm-overlay[hidden] { display: none; }
.confirm-card {
  background: var(--surface); border-radius: 16px; padding: 16px;
  max-width: 340px; width: 100%; box-shadow: 0 12px 32px rgba(90, 55, 20, .28);
}
.confirm-title { margin: 0 0 6px; font-size: 16px; font-weight: 800; }
.confirm-card .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
/* Phần T: thẻ hướng dẫn từng bước + highlight phần tử được trỏ. */
.tut-card {
  margin: 6px 10px; padding: 10px 12px; border-radius: 14px;
  background: var(--accent-soft); border: 2px solid var(--accent);
}
.tut-card-title { font-size: 13px; font-weight: 800; }
.tut-card-text { margin: 4px 0 8px; font-size: 13px; line-height: 1.45; }
.tut-card-actions { display: flex; gap: 8px; }
.tut-card-actions .sheet-btn { min-height: 44px; }
.tut-hl { outline: 3px solid var(--accent); outline-offset: 2px; }
/* C4a: khối cảnh báo ở Chuẩn bị. */
.warn-block { border: 2px solid #d9a441; border-radius: 14px; padding: 8px 12px; }
/* v1.13.0: khối Sự kiện đặc biệt ở Tổng kết — viền + nền theo tính chất sự kiện. */
.day-event-block { border: 2px solid var(--accent); border-radius: 14px; padding: 8px 12px; }
.day-event-pos { border-color: #5da85f; background: rgba(93, 168, 95, 0.10); }
.day-event-neg { border-color: #c4553b; background: rgba(196, 85, 59, 0.08); }
.day-event-name { font-size: 15px; font-weight: 800; color: var(--text-main); }
.day-event-money { font-variant-numeric: tabular-nums; }
.day-event-pos .day-event-money { color: var(--good); }
.day-event-neg .day-event-money { color: var(--warn); }
.day-event-text { margin: 4px 0; font-size: 13.5px; color: var(--text-main); }
.day-event-effect { font-size: 13px; font-weight: 700; color: var(--text-sub, #8a6d4a); }
.kho-warn { display: block; color: #8a5a0d; font-size: 12px; font-weight: 700; margin-top: 2px; }
.guide-topic h4 { margin: 10px 0 4px; }

/* ================= Đợt UI / ASSET v1.3.0 =================
   Bảng style đầy đủ nằm ở comment đầu src/assets.js (nét #8a5a3d 2.4/1.8/1.2, bảng màu
   vật thể cố định, ánh sáng trên-trái, tỉ lệ viewBox, z-order, hộp chữ an toàn).
   Khối này: thang chữ + token, R3 (chữ tường minh), R5/R6 (vùng chạm + lưới cố định),
   R7 (đầu cố định gọn), R8 (safe-area đã rải ở topbar/sheet/result), R9 (toast/popup),
   các mục 5.1–5.11 của CHANGES-ATCD và style trang ?assets=1. */
#app-frame {
  /* Thang cỡ chữ cố định (Bước 3): nhỏ nhất 12px, thân 14, tiêu đề 16–20, tiền lớn 24. */
  --fs-min: 12px; --fs-body: 14px; --fs-title: 17px; --fs-money: 24px;
  /* Màu vật thể (cố định mọi theme — đồng bộ bảng style ở assets.js). */
  --wood: #dcb87e; --wood-dark: #b57e42; --inox: #c7ccd1; --inox-dark: #8f979e;
  --paper: #fff8ec; --ink-fixed: #4a3226; --ink-label: #5d3a1a;
}
.money, .step-qty, .sheet-total, .sum-val, .badge, .count-badge, .step-qty, .buy-price {
  font-variant-numeric: tabular-nums;
}
.sheet-row-name { line-height: 1.3; }
.review-text { line-height: 1.4; }
.confirm-text { line-height: 1.45; }
.order-text { line-height: 1.4; }

/* Nút Đóng cửa GỘP VÀO HÀNG HUD (ATCD 5.2): cuối hàng đợi khách — bỏ hàng
   .service-actions riêng tốn ~50px; thanh trên giữ nguyên bề ngang ở 360px. */
.queue-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.queue-bar .queue-row { flex: 1 1 auto; min-width: 0; }
.btn-close-shop {
  flex: 0 0 auto; min-height: 44px; margin: 10px 10px 0 0; padding: 6px 12px;
  border: 2px solid var(--border); border-radius: 999px;
  background: var(--surface); color: var(--warn);
  font-size: 12.5px; font-weight: 800; white-space: nowrap;
}

/* R7: đầu cố định gọn lại — mái hiên mỏng, hàng đợi/khách nhỏ hơn, để ở 360×640 thấy
   trọn hàng bình trà + khu pha mà không phải cuộn khi đang rót. */
.awning { height: 18px; }
.queue-row { padding: 10px 12px 2px; }
.customer-figure { flex-basis: 84px; }
.customer-area { padding-bottom: 6px; }
.topbar { padding-bottom: 4px; }

/* ATCD 5.1: thẻ hướng dẫn gọn + trạng thái THU GỌN (chỉ 1 dòng, không đẩy nội dung). */
.tut-card { margin: 4px 10px; padding: 8px 10px; }
.tut-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tut-collapse {
  flex: 0 0 auto; min-height: 44px; padding: 4px 10px; border-radius: 999px;
  border: 1.5px solid var(--border-soft); background: var(--surface);
  color: var(--accent-strong); font-size: 12px; font-weight: 800;
}
.tut-card-collapsed { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tut-card-collapsed .tut-card-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tut-expand { min-height: 44px; }

/* ATCD 5.4: nhãn tồn HẾT/sắp hết — top 25px nằm DƯỚI badge số (badge cao 20px ở top 2px),
   không chồng nhau nữa. Ở ô topping nhỏ, tag nằm giữa-trên của ô (đè nhẹ lên vành khay,
   là lớp phủ có khai báo). */
.topping-cell .stock-tag { top: 25px; }

/* ATCD 5.9: kệ hương — mép phải mờ dần + bóng cuộn để gợi ý còn chai phía sau. */
.flavor-section { position: relative; }
.flavor-section::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 30px;
  background: linear-gradient(90deg, transparent, var(--counter-bg));
  pointer-events: none; border-radius: 0 6px 6px 0;
}
.flavor-shelf { scrollbar-width: thin; padding-right: 26px; }
.flavor-bottle { min-height: 104px; }

/* Bình trà: mực nước hạ khi sắp hết — counter.js gắn class .low, mức hạ truyền qua
   CSS var --jar-drop (biến xuyên qua <use>, selector thường không vào được shadow). */
.tea-jar.low { --jar-drop: 10px; }
.tea-jar.pouring .jar-art { animation: jar-shake .28s ease-in-out infinite; }
@keyframes jar-shake {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-1.6deg); }
  75% { transform: rotate(1.6deg); }
}
/* v1.4.0: khổ art bình theo lưới 3 cột (ô >= 72px): rộng 30px -> cao 42px (tỉ lệ 60x84);
   trước đây 34px/48px là khổ cho ô bình 1 hàng hẹp của v1.3.0. Rule này ở CUỐI file nên là
   rule thắng khi trùng selector với .jar-art svg ở khu hàng trà — sửa kích thước TẠI ĐÂY. */
.jar-art { display: block; width: 30px; max-width: 100%; margin: 0 auto; }
.jar-art svg { width: 100%; height: auto; max-height: 42px; }

/* Các LỚP của ly trên thớt (asset 10) — con của .board-cup, đúng z-order đã khai báo. */
.board-cup { background: linear-gradient(105deg, rgba(255,255,255,.75), rgba(255,250,242,.45) 55%, rgba(230,220,200,.5)); }
.board-cup::after { /* điểm sáng thành ly */
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 5px;
  border-radius: 3px; background: rgba(255,255,255,.65); pointer-events: none;
}
.bc-dot {
  position: absolute; bottom: 3px; width: 9px; height: 9px; border-radius: 50%;
  box-shadow: inset -1.5px -1.5px 2px rgba(0,0,0,.25), inset 1px 1px 1.5px rgba(255,255,255,.5);
}
.bc-ice {
  position: absolute; left: 16%; width: 13px; height: 11px; border-radius: 3px;
  background: #dff2fb; border: 1.4px solid #a9cfe0; transform: rotate(10deg);
  box-shadow: 15px 2px 0 -1px #dff2fb, 15px 2px 0 0 #a9cfe0;
}
.bc-foam {
  position: absolute; left: 1px; right: 1px; height: 7px; border-radius: 4px 4px 2px 2px; opacity: .92;
}
.bc-straw {
  position: absolute; top: -9px; left: 55%; width: 5px; height: 20px; border-radius: 3px;
  background: #d6455f; transform: rotate(14deg); border: 1px solid rgba(90,55,30,.35);
}

/* Hộp Đá/Đường trước Ngày 6: phủ khoá (chỉ hiển thị — asset 20). */
.mini-box.locked-look .mini-art { opacity: .45; filter: grayscale(.5); }
.mini-lock {
  position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
  font-size: 12px; font-weight: 800; color: #7a4b21;
}
.mini-lock-ico svg { width: 14px; height: 14px; }

/* Tab 2 tầng: icon lớn phía trên, chữ nhỏ phía dưới (prep + subtab). */
.sheet-tab, .sheet-subtab {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.tab-ico { font-size: 17px; line-height: 1.3; }
.tab-label { font-size: 12px; font-weight: 800; line-height: 1.25; }
.prep-tabs .sheet-tab { min-height: 52px; }

/* Nút mua 2 dòng (giá trên / "Mua" dưới) + icon trang bị trong sheet. */
.buy-btn { flex-direction: column; gap: 0; line-height: 1.2; padding: 6px 14px; }
.buy-price { font-size: 15px; font-weight: 900; }
.buy-label { font-size: 12px; font-weight: 800; }
.sheet-btn { display: inline-flex; align-items: center; justify-content: center; }
.eq-ico { flex: 0 0 40px; }
.eq-ico svg { width: 40px; height: 40px; }

/* ATCD 5.8: bảng "Theo món hôm nay" thành bảng 2 cột rõ ràng, tên món dài tự xuống dòng. */
.per-item-block .pi-row {
  display: grid; grid-template-columns: 92px 1fr; gap: 10px;
  padding: 7px 2px; border-bottom: 1px dashed var(--border-soft);
  font-size: 13.5px; font-weight: 600;
}
.pi-label { font-weight: 800; color: var(--text-main); }
.pi-items { text-align: right; font-weight: 700; overflow-wrap: break-word; min-width: 0; }

/* ATCD 5.3: bong bóng đơn — hàng nút Từ chối/xin lỗi giữ nguyên 44px; bong bóng không
   giãn vô hạn: phần chữ đơn tối đa 5 dòng rồi cuộn trong bong bóng. */
.order-text { max-height: 7em; overflow-y: auto; }

/* ATCD 5.6: hộp thoại hết hàng dùng lại .confirm-card — nút phụ là nút huỷ đúng nghĩa;
   thêm nút đóng × ở góc hộp xác nhận dùng chung. */
.confirm-card { position: relative; }
.confirm-x {
  position: absolute; top: 6px; right: 6px; width: 44px; height: 44px;
  border: none; border-radius: 50%; background: var(--accent-soft);
  color: var(--accent-strong); display: flex; align-items: center; justify-content: center;
}
.confirm-x svg { width: 18px; height: 18px; }

/* ATCD 5.10: toast kết quả — chạm vào panel giữ lại (JS gia hạn), ở đây chỉ thêm gợi ý
   trực quan là panel có thể đóng. */
.result-panel { pointer-events: none; }
.result-panel .result-close { pointer-events: auto; }

/* ATCD 5.11: highlight hướng dẫn — thêm nền mờ accent để phân biệt trên mọi theme. */
.tut-hl { outline: 3px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 5px var(--accent-soft); }

/* ATCD 5.7: khối Dự báo/Cảnh báo ở prep — tiêu đề dính khi cuộn để CTA dễ tìm hơn. */
.forecast-block, .warn-block { scroll-margin-top: 6px; }

/* Trang trí mái hiên "hoa": thêm chấm hoa trên sọc (CSS, không asset mới). */
#app-frame[data-deco-maihien="hoa"] .awning {
  background-image: radial-gradient(circle at 12px 8px, #fff 2.2px, transparent 3px),
    radial-gradient(circle at 36px 13px, #ffd9e8 2px, transparent 2.8px),
    repeating-linear-gradient(90deg, #e58bb1 0 24px, #fdeef5 24px 48px);
  background-size: 48px 18px, 48px 18px, 48px 18px;
}

/* ---------- Trang thư viện asset (?assets=1) ---------- */
.assets-page { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 10px 20px; background: var(--bg); color: var(--text-main); }
.ap-title { font-size: 20px; font-weight: 900; margin: 2px 0 4px; }
.ap-note { font-size: 13px; line-height: 1.45; color: var(--text-soft); margin: 0 0 8px; }
.ap-h { font-size: 16px; font-weight: 900; margin: 16px 0 6px; color: var(--accent-strong); }
.ap-themes { display: flex; flex-wrap: wrap; gap: 6px; }
.ap-theme {
  min-height: 44px; padding: 6px 10px; border-radius: 999px;
  border: 2px solid var(--border-soft); background: var(--surface);
  color: var(--text-main); font-size: 12.5px; font-weight: 800;
}
.ap-theme.selected { border-color: var(--accent); background: var(--accent-soft); }
.ap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ap-item { background: var(--surface); border: 1.5px solid var(--border-soft); border-radius: 12px; padding: 8px; }
.ap-cells { display: flex; gap: 6px; align-items: flex-end; }
.ap-cell { margin: 0; flex: 1; min-width: 0; }
.ap-stage {
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px; padding: 4px; overflow: hidden;
}
.ap-bg-light { background: #fff8ec; }
.ap-bg-dark { background: #332a38; }
.ap-bg-check { background: conic-gradient(#d8d2c8 25%, #f4efe6 0 50%, #d8d2c8 0 75%, #f4efe6 0) 0 0 / 12px 12px; }
.ap-cap { font-size: 12px; font-weight: 700; color: var(--text-soft); text-align: center; margin-top: 2px; }
.ap-id { font-size: 12.5px; font-weight: 800; margin-top: 6px; overflow-wrap: break-word; }
.ap-safe {
  font-size: 12px; line-height: 1.35; color: #8a5a0d; margin-top: 3px;
  border: 1.5px dashed #c0392b; border-radius: 6px; padding: 4px 6px;
}
.ap-awns { display: grid; gap: 6px; margin-top: 8px; }
.ap-awn { min-height: 44px; border-radius: 8px; display: flex; align-items: center; padding: 6px 10px; font-size: 12.5px; font-weight: 800; color: #5d3a1a; border: 1.5px solid var(--border-soft); }
.ap-audit-btn { width: 100%; margin-top: 16px; }
.ap-audit-out {
  margin-top: 10px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: break-word;
  background: var(--surface); border: 1.5px solid var(--border-soft); border-radius: 10px; padding: 8px;
  max-height: 320px; overflow-y: auto;
}

/* =====================================================================
   v1.6.0 — LỆNH BỐ CỤC CỦA USER (CHANGES-V16):
   1) bong bóng đơn nhỏ gọn · 2) thẻ hướng dẫn = lớp phủ tự đổi chỗ ·
   4) hàng trà 1 hàng ngang, bỏ nhãn QUẦY TRÀ/PHA LY · 5) món khoá hiện
   hình mờ + ổ khoá · 6) màn phục vụ vừa trọn 1 màn hình, KHÔNG cuộn.
   ===================================================================== */

/* --- 1) Cụm khách + bong bóng gọn lại --- */
.awning { height: 14px; }
.queue-row { padding: 6px 12px 0; }
.btn-close-shop { margin: 6px 10px 0 0; }
.customer-area { gap: 6px; padding: 2px 10px 4px; }
.customer-figure { flex-basis: 62px; }
.speech-bubble { padding: 6px 8px; grid-template-columns: 30px minmax(0, 1fr); column-gap: 6px; }
.bubble-cup svg { width: 25px; height: 30px; }
.bubble-head { margin-bottom: 0; }
.hint-toggle { min-height: 46px; }
.order-text { font-size: 13px; line-height: 1.4; }
.oos-row { margin-top: 3px; }
/* Thanh kiên nhẫn + nút Hết món/Từ chối CHUNG một hàng (mục 1) */
.bubble-foot { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.bubble-foot .patience-row { flex: 1 1 auto; min-width: 0; margin-top: 0; }
.patience-track { height: 7px; }
.bubble-foot .bubble-actions { flex: 0 0 auto; margin-top: 0; }
/* 46px (không phải 44): bong bóng có animation vào scale(.96) — giữa animation hộp đo
   thực tế = 44 x 0,96 = 42,2px < ngưỡng audit 43,5px; 46px giữ 44,2px khi đang scale. */
.reject-btn, .oos-apologize-btn { min-height: 46px; padding: 5px 12px; }

/* --- 2) Thẻ hướng dẫn = lớp phủ trong #app-frame (ngoài luồng layout) --- */
#tutorial-overlay { position: absolute; inset: 0; z-index: 48; pointer-events: none; }
#tutorial-overlay .tut-card {
  position: absolute; left: 10px; right: 10px; margin: 0;
  max-height: 48%; overflow-y: auto; pointer-events: none;
  box-shadow: 0 10px 28px rgba(31, 24, 16, .35);
}
/* Thân thẻ XUYÊN click (chạm xuyên qua tới quầy bên dưới — thẻ không bao giờ chặn thao
   tác pha chế, kể cả khi đang đè lên một khu tương tác); chỉ các NÚT của thẻ nhận click. */
#tutorial-overlay .tut-card button { pointer-events: auto; }

/* --- 4) Hàng trà MỘT HÀNG NGANG (ly M, ly L, 6 bình, máy dán nắp) --- */
.tea-row { display: flex; gap: 4px; align-items: stretch; margin-top: 0; }
.tea-row .cup-stack {
  flex: 0 0 32px; width: auto; min-height: 56px; padding-bottom: 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
}
.tea-row .cup-stack svg { width: 24px; height: 37px; }
.tea-row .tea-jar { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 2px 0 3px; }
.tea-row .jar-art { width: 20px; }
.tea-row .jar-art svg { max-height: 28px; }
.tea-row .jar-label { white-space: normal; transform: none; letter-spacing: 0; line-height: 1.25; }
.tea-row .stock-tag { top: 15px; }
.tea-row .sealer { flex: 0 0 40px; min-height: 56px; }
.tea-row .sealer-art svg { width: 35px; height: 44px; max-height: 44px; }
/* brew-head giờ chỉ còn nút thùng rác: canh phải, không tốn thêm hàng nhãn */
.brew-head { justify-content: flex-end; margin-bottom: 0; }

/* --- 5) Món chưa mở khoá: hình mờ/xám + ổ khoá --- */
.topping-cell.preview-locked { background: #e6e9ec; }
.topping-cell.preview-locked .topping-art { opacity: .38; filter: grayscale(.85); }
.cell-lock-ico { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.cell-lock-ico svg { width: 20px; height: 20px; }
.flavor-bottle.locked-bottle .bottle-art { opacity: .38; filter: grayscale(.85); }
.bottle-lock-ico { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); pointer-events: none; }
.bottle-lock-ico svg { width: 20px; height: 20px; }

/* --- 6) Pha phục vụ: KHÔNG CUỘN — flex co theo chiều cao khả dụng --- */
.counter-scroll.svc-main {
  overflow: hidden; display: flex; flex-direction: column;
  padding: 2px 0 calc(4px + env(safe-area-inset-bottom));
}
.svc-main .counter-section { flex: 0 0 auto; padding: 4px 10px 2px; }
.svc-main .brew-section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.svc-main .brew-grid { flex: 1 1 auto; min-height: 0; margin-top: 2px; }
.svc-main .brew-left { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.svc-main .board { flex: 1 1 auto; min-height: 0; }
.svc-main .board-cup { height: 52px; }
.svc-main .ice-sugar { flex: 0 0 auto; margin-top: 4px; }
.svc-main .topping-grid { min-height: 0; height: 100%; grid-auto-rows: 1fr; align-content: stretch; padding-top: 0; padding-bottom: 0; }
.svc-main .topping-cell { aspect-ratio: auto; min-height: 0; height: 100%; }
.svc-main .topping-art { height: 100%; display: flex; align-items: center; justify-content: center; }
/* Kích thước theo viewBox 68x92: chỉ khoá width, height auto theo tỉ lệ + max-* để
   svg co theo ô mà KHÔNG méo tỉ lệ (audit viewbox). Rule min(97cqw, 74cqh) ở
   block container bên dưới thắng rule này (cùng độ ưu tiên, khai báo sau). */
.svc-main .topping-art svg { width: 68px; height: auto; max-width: 100%; max-height: 100%; }
.svc-main .flavor-section { padding-top: 4px; }
.svc-main .flavor-shelf { padding: 6px 10px 2px; }
.svc-main .flavor-bottle { min-height: 78px; }
.svc-main .bottle-art svg { height: 50px; }
.svc-main .bottle-lock-ico { top: 20px; }

/* Màn hình THẤP (<=719px, vd 360x640): nén thêm để vẫn vừa trọn 1 màn hình */
@media (max-height: 719px) {
  .topbar { padding-top: 5px; padding-bottom: 5px; }
  .awning { height: 12px; }
  .queue-avatar { width: 46px; height: 46px; }
  .customer-figure { flex-basis: 54px; }
  .tea-row .cup-stack, .tea-row .tea-jar, .tea-row .sealer { min-height: 50px; }
  .tea-row .jar-art { width: 18px; }
  .tea-row .jar-art svg { max-height: 20px; }
  /* Hàng thùng rác (brew-head) chuyển thành CỘT DỌC 46px bên trái khu pha ở màn thấp:
     tiết kiệm ~44px chiều cao cho lưới topping/thớt (bù lại lưới hẹp đi 46px). */
  .svc-main .brew-section { flex-direction: row; }
  .svc-main .brew-head { flex: 0 0 46px; align-items: flex-start; justify-content: center; }
  .svc-main .brew-grid { flex: 1 1 auto; min-width: 0; }
  .sheet-tabs { padding-top: 1px; padding-bottom: 1px; }
  .svc-main .board { min-height: 44px; }
  .svc-main .board-cup { height: 40px; }
  .svc-main .mini-box { min-height: 52px; }
  .svc-main .mini-art svg { width: 34px; }
  .svc-main .flavor-bottle { min-height: 57px; }
  .svc-main .bottle-art svg { height: 33px; }
  .svc-main .flavor-shelf { padding-top: 2px; padding-bottom: 2px; }
  .svc-main .bottle-lock-ico { top: 12px; }
}

/* v1.6.0 bổ sung: thớt trong pha phục vụ — board-main CO LẠI được (min-height 0 +
   overflow hidden) và hàng nút/meter giữ cố định, để nội dung thớt cao (dòng extras
   Đường/Đá/topping) không đẩy nút Giao ly tràn xuống đè hàng đá/đường bên dưới. */
.svc-main .board-main { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.svc-main .board-meter, .svc-main .board-actions { flex: 0 0 auto; }
.svc-main .board-text { margin-top: 6px; }

/* =====================================================================
   v1.7.0 — VẼ LẠI ASSET + BỐ CỤC THEO ẢNH GỐC (CHANGES-V17):
   A) nội thất: bệ gỗ quầy trà, hộc gỗ tối kệ hương, TAB GỖ NHỎ ghim mép khu ·
   B) khách lớn bên trái (~27%), bong bóng có đuôi nhọn, ly mini to hơn ·
   C) chồng ly trong suốt xếp cao, bình kính nhãn dán TRÊN thân, máy dán nắp
      cao có cuộn màng · D) khay topping THÉP NGUYÊN KHỐI + ô lõm, ô khoá phủ
      kính mờ + khoá vàng, thùng rác trụ kim loại, hộp đá/đường thùng vuông ·
   E) chai hương cao, đầu bơm đen, siro đáy chai, tên vị trong chip giấy ·
   F) thanh trên giữ nguyên (đã khớp ảnh gốc từ các đợt trước).
   ===================================================================== */

/* --- B) Khách lớn + bong bóng --- */
.customer-figure { flex-basis: 27%; max-width: 118px; }
.speech-bubble { grid-template-columns: 38px minmax(0, 1fr); column-gap: 7px; }
.bubble-cup svg { width: 34px; height: 41px; }
/* Đuôi bong bóng: hình thoi xoay 45° (thay tam giác border cũ), trỏ sang mặt khách. */
.speech-bubble::before {
  content: ""; position: absolute; left: -9px; top: 42px;
  width: 15px; height: 15px; background: var(--surface);
  border: none; border-left: 2px solid #e8cdb4; border-bottom: 2px solid #e8cdb4;
  transform: rotate(45deg);
}

/* --- A) (v1.8.0: biển .wood-tab đã GỠ hẳn theo lệnh user — không còn phần tử nào) --- */
.tea-section, .brew-section { position: relative; }
.svc-main .tea-section { margin-top: 8px; }

/* --- A+C) Bệ gỗ quầy trà: mặt bệ sáng + mặt trước gỗ đậm ở đáy hàng --- */
.tea-row {
  gap: 2px; padding: 2px 2px 13px; border-radius: 0 0 10px 10px;
  background: linear-gradient(to top,
    #a9713a 0 10px, #7c4f28 10px 11.5px, #e9c48d 11.5px 14.5px, rgba(233, 196, 141, 0) 15px);
}
/* Bình trà: bỏ nền thẻ — bình đứng thẳng trên bệ; viền chọn = vòng hồng quanh bình. */
.tea-row .tea-jar {
  background: transparent; border: 2px solid transparent; border-radius: 14px;
  padding: 0; justify-content: flex-end;
}
.jar-wrap { position: relative; display: block; width: 100%; }
.tea-row .jar-art { width: 100%; }
.tea-row .jar-art svg { width: 100%; height: auto; max-height: none; }
.tea-jar.low { --jar-drop: 14px; }
/* Nhãn dán TRÊN thân bình: chính .jar-label là nhãn (nền giấy + viền nâu), đè trên
   PHẦN TRÊN thân bình (ngay dưới vành nắp) như ảnh gốc — phần thân dưới nhãn để lộ
   dải trà đậm xuống vòi rót, bình đọc như đang đầy ~70% chứ không phải chai rỗng. */
.tea-row .jar-label {
  position: absolute; left: 3%; right: 3%; top: 23%;
  background: #fff8ec; border: 1.5px solid #b7a98f; border-radius: 5px;
  padding: 1px 1px; text-align: center;
  font-size: 12px; font-weight: 800; line-height: 1.15; color: #5d3a1a;
  letter-spacing: -.5px; transform: scaleX(.88); white-space: normal;
}
/* Tag HẾT/sắp hết của bình: treo ở MẶT TRƯỚC BỆ ngay dưới chân bình (bottom âm vào
   vùng đệm 13px của mặt bệ) — không đè nhãn dán trên thân bình, không che vòi rót. */
.tea-row .stock-tag { top: auto; bottom: -11px; }
/* Chồng ly: art cao theo size (L cao hơn M rõ), đứng trên bệ. Kích thước svg khai
   CẢ width+height đúng tỉ lệ viewBox 48×96 (0.5) để audit viewbox không báo méo —
   không để width auto bị max-width:100% kẹp lệch tỉ lệ. */
.tea-row .cup-stack { padding: 0; justify-content: flex-end; }
.tea-row .cup-stack svg { margin: 0 auto; }
.tea-row .cup-stack[data-id="M"] { flex: 0 0 26px; }
.tea-row .cup-stack[data-id="M"] svg { width: 26px; height: 52px; }
.tea-row .cup-stack[data-id="L"] { flex: 0 0 30px; }
.tea-row .cup-stack[data-id="L"] svg { width: 30px; height: 60px; }
/* Badge tồn của chồng ly: hạ xuống dưới mép dưới của tab QUẦY TRÀ (tab ghim ở góc
   trên-trái sẽ che badge nếu badge nằm ở top 2px như các nút khác). */
.tea-row .cup-stack .badge { top: 24px; }
/* Máy dán nắp: cao hơn bình (art lấp gần hết chiều cao hàng), neo đáy trên bệ. */
.tea-row .sealer { flex: 0 0 48px; display: flex; align-items: flex-end; justify-content: center; }
.tea-row .sealer-art svg { width: 100%; height: auto; max-height: none; }

/* --- D) Khu pha: thùng rác góc trên-trái (cạnh tab PHA LY), thớt gỗ sáng --- */
.brew-head { justify-content: flex-start; }
.brew-head .bin { margin-left: 96px; width: 44px; }
.board { background: linear-gradient(165deg, #f2d5a2, #e7bf85); }

/* Khay topping: MỘT KHAY THÉP nguyên khối, ô VUÔNG LÕM xếp sát trong khay. */
.topping-grid {
  background: linear-gradient(#eef1f4, #c9cfd6);
  border: 3px solid #98a1a9; border-radius: 14px;
  box-shadow: inset 0 2px 6px rgba(70, 50, 30, .22), 0 1px 3px rgba(90, 55, 20, .18);
  gap: 5px; padding: 6px;
}
.topping-cell {
  background: linear-gradient(#f7f9fa, #dde2e6);
  border: 1.5px solid #a7b0b8; border-radius: 9px;
  box-shadow: inset 0 2px 5px rgba(70, 50, 30, .24), inset 0 -2px 3px rgba(255, 255, 255, .65);
}
/* Ô đang chọn (đã cho vào ly): viền HỒNG như ảnh gốc. */
.topping-cell.in-cup { box-shadow: 0 0 0 2.5px var(--accent), inset 0 2px 5px rgba(70, 50, 30, .24); border-radius: 9px; }
/* Ô KHOÁ: mặt ô PHỦ KÍNH MỜ TRẮNG + ổ khoá VÀNG ở chính giữa. */
.topping-cell.locked { background: linear-gradient(#fdfefd, #e9edea); }
.topping-cell.locked::after {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: rgba(255, 255, 255, .5); border-radius: 8px; pointer-events: none;
}
.topping-cell.preview-locked .topping-art { opacity: .55; filter: grayscale(.35); }
/* .cell-lock-ico giữ position:absolute (inset 0) của v1.6 — chỉ nâng z-index trên lớp
   kính mờ ::after (z 1); .lock-ico là span thường trong ô nên cần position để z-index chạy. */
.topping-cell .cell-lock-ico { z-index: 2; }
.topping-cell .lock-ico { position: relative; z-index: 2; }
.topping-cell .lock-ico svg { width: 24px; height: 24px; opacity: 1; }

/* Hộp đá/đường: thùng kim loại là chính art; biển tên NHỎ NẰM DƯỚI hộp (chip giấy). */
.mini-box { background: transparent; border: none; box-shadow: none; padding: 2px 0 0; gap: 0; justify-content: flex-end; }
.mini-box.hint { border-color: transparent; box-shadow: 0 0 0 2.5px var(--accent); border-radius: 12px; }
.mini-art { width: 58px; }
.mini-art svg { width: 100%; height: auto; }
.mini-label {
  background: #fff8ec; border: 1.5px solid #b7a98f; border-radius: 6px;
  padding: 1px 7px; margin-top: 1px;
}
.mini-lock { bottom: auto; top: 0; }

/* --- A+E) Kệ hương trong HỘC GỖ TỐI lõm; tên vị là chip giấy sáng trên nền tối --- */
.flavor-shelf {
  background: linear-gradient(180deg, #5d3a1e 0, #77502a 16%, #7c4f28 76%, #a06a34 77%, #8a5a2e 100%);
  border-top: 5px solid #4c2f16; border-radius: 8px;
  box-shadow: inset 0 12px 16px rgba(30, 15, 0, .45), inset 0 -4px 8px rgba(30, 15, 0, .3);
}
.flavor-section::after { background: linear-gradient(90deg, transparent, #77502a); }
.flavor-bottle { text-align: center; }

/* Ô topping là CONTAINER kích thước (container-type: size): art svg lấy bề ngang
   theo min(97% bề ngang ô, 84% bề cao ô) — hộp svg LUÔN giữ tỉ lệ 68×92 dù ô
   bị ép thấp ở 360×640 (trước đây max-height kẹp chiều cao mà bề ngang giữ nguyên
   -> audit viewbox báo méo). v1.8.0 sửa bổ sung: canvas topping đổi 68×60 -> 68×92
   (ô quầy cao hơn rộng; canvas thấp cũ làm khay ĐẦY chỉ lấp ~40% chiều cao ô) +
   BỎ trần 68px/76cqh cũ — texture nay PHỦ GẦN KÍN mặt ô: bề ngang ~97cqw, chiều
   cao suy ra = min(131cqw, 100cqh) (đúng công thức cửa sổ .topping-pile bên
   dưới, hai nơi phải khớp nhau). LƯU Ý: cq tính theo HỘP NỘI DUNG của ô.
   v1.9.0: trần bề ngang 74cqh -> 84cqh — ô topping ở 390x844 thấp đi (61px, vì
   tủ hương 2 hàng lấy thêm chiều cao) làm trần 74cqh bóp bề ngang art còn 83%
   cửa sổ khay; trần 84cqh cho art cao hơn cửa sổ đầy một chút (cửa sổ .topping-pile
   neo đáy + overflow hidden nên chỉ cắt phần đỉnh texture, mặt đống vẫn phủ kín
   ~95% bề ngang cửa sổ ở mức đầy). */
.topping-cell { container-type: size; }
.svc-main .topping-art svg {
  width: min(97cqw, 84cqh); height: auto; max-width: none; max-height: none;
}

/* Màn THẤP (<=719px): nén tỉ lệ art của hàng trà/khu pha theo cùng hệ số. */
@media (max-height: 719px) {
  /* Màn thấp: nhân vật 20% (không phải 24%) — bong bóng cần bề ngang để dòng đơn
     2 ly không ngắt 3 dòng/dòng, giữ cụm khách gọn cho quầy bên dưới. */
  .customer-figure { flex-basis: 20%; }
  .speech-bubble { grid-template-columns: 30px minmax(0, 1fr); }
  .bubble-cup svg { width: 27px; height: 33px; }
  .tea-row .cup-stack[data-id="M"] { flex-basis: 24px; }
  .tea-row .cup-stack[data-id="M"] svg { width: 24px; height: 48px; }
  .tea-row .cup-stack[data-id="L"] { flex-basis: 28px; }
  .tea-row .cup-stack[data-id="L"] svg { width: 28px; height: 56px; }
  .tea-row .cup-stack .badge { top: 20px; }
  .tea-row .sealer { flex-basis: 40px; }
  .svc-main .tea-section { margin-top: 5px; }
  .tea-row .jar-label { top: 21%; }
  /* Tab PHA LY ở màn thấp: nâng lên ghim vào dải gỗ ranh giới 2 khu (top -9) để
     không che dòng chữ nhắc trên thớt (thớt bắt đầu ngay dưới mép khu pha). */
  .svc-main .brew-head .bin { margin-left: 0; }
  .mini-art { width: 34px; }
  .svc-main .mini-box { min-height: 48px; }
  /* Nén thêm cột trái khu pha ở màn thấp: thớt bớt padding/gap, biển tên đá/đường
     gọn lại — đủ cho hàng đá/đường không tràn xuống kệ hương ở ca chật nhất
     (demo Ngày 21, 360×640, audit overlap từng báo tràn 12px). */
  .svc-main .board { padding: 6px; gap: 4px; }
  .svc-main .ice-sugar { margin-top: 2px; }
  .mini-label { padding: 0 7px; line-height: 1.25; }
  /* Đợt nén thứ hai cho ca demo 360×640 (đo rect trực tiếp): tổng tối thiểu của cột
     trái (thớt sàn 44 + hàng đá/đường 65 vì biển "NƯỚC ĐƯỜNG" 2 dòng như ảnh gốc)
     vượt chiều cao lưới pha ~17px. Thu: sàn thớt 44->38 + bỏ margin-top chữ thớt,
     art đá/đường 34->26px, chồng ly L 56->52 + chip size gọn, margin tab trà 5->2,
     hàng đá/đường margin-top 0. Tổng ~20px. */
  .svc-main .board { min-height: 38px; padding: 4px 6px; }
  .svc-main .board-text { margin-top: 0; }
  .mini-art { width: 26px; }
  .svc-main .mini-art svg { width: 26px; }
  .tea-row .cup-stack[data-id="L"] { flex-basis: 26px; }
  .tea-row .cup-stack[data-id="L"] svg { width: 26px; height: 52px; }
  .cup-size { padding: 0; line-height: 1.2; }
  .svc-main .tea-section { margin-top: 2px; }
  .svc-main .ice-sugar { margin-top: 0; }
}

/* =====================================================================
   v1.8.0 — PHẢN HỒI USER SAU KHI CHƠI v1.7.0 (CHANGES-V18):
   1) cụm khách + bong bóng THU HẸP ~1 NỬA: đầu phục vụ chia 2 cột
      (trái 55% khách+bong bóng · phải 45% hàng đợi + Đóng cửa + lưới
      2×2 nút tắt — XOÁ hàng tab ngang toàn bề ngang cũ) ·
   2) chai hương BỎ chữ tên, nhãn là HÌNH TRÁI CÂY to/chi tiết ·
   3) khay topping ĐẦY/RỖNG theo tồn kho thật (.topping-pile theo --fill) ·
   4) nội thất + máy dán nắp + thớt vẽ lại 2.5D (khối, bóng, góc cạnh),
      máy XOÁ chữ READY -> đèn tín hiệu · 5) GỠ biển QUẦY TRÀ/PHA LY.
   ===================================================================== */

/* Nhãn bình trà: nới line-height 1.15 -> 1.25 (audit UI v1.8 bắt lỗi chữ chật
   lh < fs x 1.19 ở nhãn 2 dòng như HỒNG TRÀ; nhãn là absolute nên không đổi layout). */
.tea-row .jar-label { line-height: 1.25; }

/* --- 1) Cụm đầu phục vụ 2 cột --- */
.svc-head { display: grid; grid-template-columns: 55% 45%; align-items: start; }
.svc-head-left { min-width: 0; }
.svc-head-left .customer-area { padding: 2px 2px 4px 10px; }
/* Khách nhỏ lại: figure tính theo bề ngang CỘT TRÁI (~15% khung) thay vì 27% khung. */
.svc-head-left .customer-figure { flex-basis: 26%; max-width: 64px; }
.svc-head-right {
  min-width: 0; display: flex; flex-direction: column; gap: 4px;
  padding: 6px 10px 4px 2px;
}
.svc-head-right .queue-row { padding: 0; flex-wrap: wrap; gap: 6px; }
.svc-head-right .queue-empty { font-size: 12.5px; line-height: 1.35; padding-top: 12px; }
.svc-close-row { display: flex; }
.svc-head-right .btn-close-shop { margin: 0; }
/* Công tắc Gợi ý chuyển từ đầu bong bóng sang cột phải (v1.8.0): bong bóng hẹp
   không còn chỗ cho hàng tên + công tắc 46px; công tắc là điều khiển PHIÊN nên
   đặt ở cột điều khiển phải là hợp lý, giữ nguyên data-hint-toggle + min-height. */
.svc-side-tools { display: flex; }
.svc-side-tools .hint-toggle { margin-left: 0; min-height: 44px; }
.svc-shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.svc-shortcuts .sheet-tab { min-height: 46px; border-radius: 14px; padding: 3px 2px; width: 100%; }
/* Bong bóng hẹp (~nửa khung): đầu bong bóng cho WRAP (tên khách rút ellipsis,
   công tắc Gợi ý xuống dòng khi chật) và chân bong bóng cho hàng KIÊN NHẪN trọn
   một dòng riêng (nhãn + thanh không bị nút Từ chối bóp mất), nút xuống dòng dưới. */
.svc-head-left .bubble-head { flex-wrap: wrap; row-gap: 0; }
.svc-head-left .customer-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.svc-head-left .bubble-foot { flex-wrap: wrap; }
.svc-head-left .bubble-foot .patience-row { flex: 1 1 100%; }
/* Trong bong bóng hẹp, hàng KIÊN NHẪN xếp DỌC: nhãn trên, thanh dưới trọn bề ngang
   bong bóng — để thanh kiên nhẫn dài/đọc rõ như bản gốc thay vì bị nhãn bóp còn vài px. */
.svc-head-left .patience-row { flex-direction: column; align-items: stretch; gap: 2px; }
.svc-head-left .patience-label { align-self: flex-start; }
/* flex:1 của .patience-track đặt flex-basis 0% — ở hàng NGANG basis ăn theo bề
   ngang (đúng), nhưng hàng DỌC thì basis ăn theo chiều CAO làm thanh co về 0px:
   phải khoá flex: 0 0 auto + height tường minh ở bố cục dọc này. */
.svc-head-left .patience-track { flex: 0 0 auto; width: 100%; height: 7px; }
.svc-head-left .bubble-foot .bubble-actions { margin-left: auto; }
/* Không còn tab gỗ ghim mép -> kệ trà không cần chừa margin cho tab nữa. */
.svc-main .tea-section { margin-top: 3px; }
/* Thùng rác về sát trái khu pha (hết biển PHA LY để né). */
.brew-head .bin { margin-left: 2px; }

/* --- 2) Chai hương: bỏ tên -> chai cao hơn trong cùng ô kệ, trái cây to hơn --- */
