        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
      }
      .tea-row .cup-stack svg {
        width: 24px;
        height: 37px;
      }
      .tea-row .tea-jar {
        flex: 1 1 0;
        min-width: 0;
        min-height: 56px;
        padding: 2px 0 3px;
      }
      .tea-row .jar-art {
        width: 20px;
      }
      .tea-row .jar-art svg {
        max-height: 28px;
      }
      .tea-row .jar-label {
        white-space: normal;
        transform: none;
        letter-spacing: 0;
        line-height: 1.25;
      }
      .tea-row .stock-tag {
        top: 15px;
      }
      .tea-row .sealer {
        flex: 0 0 40px;
        min-height: 56px;
      }
      .tea-row .sealer-art svg {
        width: 35px;
        height: 44px;
        max-height: 44px;
      }
      /* brew-head giờ chỉ còn nút thùng rác: canh phải, không tốn thêm hàng nhãn */
      .brew-head {
        justify-content: flex-end;
        margin-bottom: 0;
      }

      /* --- 5) Món chưa mở khoá: hình mờ/xám + ổ khoá --- */
      .topping-cell.preview-locked {
        background: #e6e9ec;
      }
      .topping-cell.preview-locked .topping-art {
        opacity: 0.38;
        filter: grayscale(0.85);
      }
      .cell-lock-ico {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .cell-lock-ico svg {
        width: 20px;
        height: 20px;
      }
      .flavor-bottle.locked-bottle .bottle-art {
        opacity: 0.38;
        filter: grayscale(0.85);
      }
      .bottle-lock-ico {
        position: absolute;
        left: 50%;
        top: 30px;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .bottle-lock-ico svg {
        width: 20px;
        height: 20px;
      }

      /* --- 6) Pha phục vụ: KHÔNG CUỘN — flex co theo chiều cao khả dụng --- */
      .counter-scroll.svc-main {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 2px 0 calc(4px + env(safe-area-inset-bottom));
      }
      .svc-main .counter-section {
        flex: 0 0 auto;
        padding: 4px 10px 2px;
      }
      .svc-main .brew-section {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .svc-main .brew-grid {
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 2px;
      }
      .svc-main .brew-left {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .svc-main .board {
        flex: 1 1 auto;
        min-height: 0;
      }
      .svc-main .board-cup {
        height: 52px;
      }
      .svc-main .ice-sugar {
        flex: 0 0 auto;
        margin-top: 4px;
      }
      .svc-main .topping-grid {
        min-height: 0;
        height: 100%;
        grid-auto-rows: 1fr;
        align-content: stretch;
        padding-top: 0;
        padding-bottom: 0;
      }
      .svc-main .topping-cell {
        aspect-ratio: auto;
        min-height: 0;
        height: 100%;
      }
      .svc-main .topping-art {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Kích thước theo viewBox 68x92: chỉ khoá width, height auto theo tỉ lệ + max-* để
   svg co theo ô mà KHÔNG méo tỉ lệ (audit viewbox). Rule min(97cqw, 74cqh) ở
   block container bên dưới thắng rule này (cùng độ ưu tiên, khai báo sau). */
      .svc-main .topping-art svg {
        width: 68px;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      .svc-main .flavor-section {
        padding-top: 4px;
      }
      .svc-main .flavor-shelf {
        padding: 6px 10px 2px;
      }
      .svc-main .flavor-bottle {
        min-height: 78px;
      }
      .svc-main .bottle-art svg {
        height: 50px;
      }
      .svc-main .bottle-lock-ico {
        top: 20px;
      }

      /* Màn hình THẤP (<=719px, vd 360x640): nén thêm để vẫn vừa trọn 1 màn hình */
      @media (max-height: 719px) {
        .topbar {
          padding-top: 5px;
          padding-bottom: 5px;
        }
        .awning {
          height: 12px;
        }
        .queue-avatar {
          width: 46px;
          height: 46px;
        }
        .customer-figure {
          flex-basis: 54px;
        }
        .tea-row .cup-stack,
        .tea-row .tea-jar,
        .tea-row .sealer {
          min-height: 50px;
        }
        .tea-row .jar-art {
          width: 18px;
        }
        .tea-row .jar-art svg {
          max-height: 20px;
        }
        /* Hàng thùng rác (brew-head) chuyển thành CỘT DỌC 46px bên trái khu pha ở màn thấp:
     tiết kiệm ~44px chiều cao cho lưới topping/thớt (bù lại lưới hẹp đi 46px). */
        .svc-main .brew-section {
          flex-direction: row;
        }
        .svc-main .brew-head {
          flex: 0 0 46px;
          align-items: flex-start;
          justify-content: center;
        }
        .svc-main .brew-grid {
          flex: 1 1 auto;
          min-width: 0;
        }
        .sheet-tabs {
          padding-top: 1px;
          padding-bottom: 1px;
        }
        .svc-main .board {
          min-height: 44px;
        }
        .svc-main .board-cup {
          height: 40px;
        }
        .svc-main .mini-box {
          min-height: 52px;
        }
        .svc-main .mini-art svg {
          width: 34px;
        }
        .svc-main .flavor-bottle {
          min-height: 57px;
        }
        .svc-main .bottle-art svg {
          height: 33px;
        }
        .svc-main .flavor-shelf {
          padding-top: 2px;
          padding-bottom: 2px;
        }
        .svc-main .bottle-lock-ico {
          top: 12px;
        }
      }

      /* v1.6.0 bổ sung: thớt trong pha phục vụ — board-main CO LẠI được (min-height 0 +
   overflow hidden) và hàng nút/meter giữ cố định, để nội dung thớt cao (dòng extras
   Đường/Đá/topping) không đẩy nút Giao ly tràn xuống đè hàng đá/đường bên dưới. */
      .svc-main .board-main {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .svc-main .board-meter,
      .svc-main .board-actions {
        flex: 0 0 auto;
      }
      .svc-main .board-text {
        margin-top: 6px;
      }

      /* =====================================================================
   v1.7.0 — VẼ LẠI ASSET + BỐ CỤC THEO ẢNH GỐC (CHANGES-V17):
   A) nội thất: bệ gỗ quầy trà, hộc gỗ tối kệ hương, TAB GỖ NHỎ ghim mép khu ·
   B) khách lớn bên trái (~27%), bong bóng có đuôi nhọn, ly mini to hơn ·
   C) chồng ly trong suốt xếp cao, bình kính nhãn dán TRÊN thân, máy dán nắp
      cao có cuộn màng · D) khay topping THÉP NGUYÊN KHỐI + ô lõm, ô khoá phủ
      kính mờ + khoá vàng, thùng rác trụ kim loại, hộp đá/đường thùng vuông ·
   E) chai hương cao, đầu bơm đen, siro đáy chai, tên vị trong chip giấy ·
   F) thanh trên giữ nguyên (đã khớp ảnh gốc từ các đợt trước).
   ===================================================================== */

      /* --- B) Khách lớn + bong bóng --- */
      .customer-figure {
        flex-basis: 27%;
        max-width: 118px;
      }
      .speech-bubble {
        grid-template-columns: 38px minmax(0, 1fr);
        column-gap: 7px;
      }
      .bubble-cup svg {
        width: 34px;
        height: 41px;
      }
      /* Đuôi bong bóng: hình thoi xoay 45° (thay tam giác border cũ), trỏ sang mặt khách. */
      .speech-bubble::before {
        content: "";
        position: absolute;
        left: -9px;
        top: 42px;
        width: 15px;
        height: 15px;
        background: var(--surface);
        border: none;
        border-left: 2px solid #e8cdb4;
        border-bottom: 2px solid #e8cdb4;
        transform: rotate(45deg);
      }

      /* --- A) (v1.8.0: biển .wood-tab đã GỠ hẳn theo lệnh user — không còn phần tử nào) --- */
      .tea-section,
      .brew-section {
        position: relative;
      }
      .svc-main .tea-section {
        margin-top: 8px;
      }

      /* --- A+C) Bệ gỗ quầy trà: mặt bệ sáng + mặt trước gỗ đậm ở đáy hàng --- */
      .tea-row {
        gap: 2px;
        padding: 2px 2px 13px;
        border-radius: 0 0 10px 10px;
        background: linear-gradient(
          to top,
          #a9713a 0 10px,
          #7c4f28 10px 11.5px,
          #e9c48d 11.5px 14.5px,
          rgba(233, 196, 141, 0) 15px
        );
      }
      /* Bình trà: bỏ nền thẻ — bình đứng thẳng trên bệ; viền chọn = vòng hồng quanh bình. */
      .tea-row .tea-jar {
        background: transparent;
        border: 2px solid transparent;
        border-radius: 14px;
        padding: 0;
        justify-content: flex-end;
      }
      .jar-wrap {
        position: relative;
        display: block;
        width: 100%;
      }
      .tea-row .jar-art {
        width: 100%;
      }
      .tea-row .jar-art svg {
        width: 100%;
        height: auto;
        max-height: none;
      }
      .tea-jar.low {
        --jar-drop: 14px;
      }
      /* Nhãn dán TRÊN thân bình: chính .jar-label là nhãn (nền giấy + viền nâu), đè trên
   PHẦN TRÊN thân bình (ngay dưới vành nắp) như ảnh gốc — phần thân dưới nhãn để lộ
   dải trà đậm xuống vòi rót, bình đọc như đang đầy ~70% chứ không phải chai rỗng. */
      .tea-row .jar-label {
        position: absolute;
        left: 3%;
        right: 3%;
        top: 23%;
        background: #fff8ec;
        border: 1.5px solid #b7a98f;
        border-radius: 5px;
        padding: 1px 1px;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.15;
        color: #5d3a1a;
        letter-spacing: -0.5px;
        transform: scaleX(0.88);
        white-space: normal;
      }
      /* Tag HẾT/sắp hết của bình: treo ở MẶT TRƯỚC BỆ ngay dưới chân bình (bottom âm vào
   vùng đệm 13px của mặt bệ) — không đè nhãn dán trên thân bình, không che vòi rót. */
      .tea-row .stock-tag {
        top: auto;
        bottom: -11px;
      }
      /* Chồng ly: art cao theo size (L cao hơn M rõ), đứng trên bệ. Kích thước svg khai
   CẢ width+height đúng tỉ lệ viewBox 48×96 (0.5) để audit viewbox không báo méo —
   không để width auto bị max-width:100% kẹp lệch tỉ lệ. */
      .tea-row .cup-stack {
        padding: 0;
        justify-content: flex-end;
      }
      .tea-row .cup-stack svg {
        margin: 0 auto;
      }
      .tea-row .cup-stack[data-id="M"] {
        flex: 0 0 26px;
      }
      .tea-row .cup-stack[data-id="M"] svg {
        width: 26px;
        height: 52px;
      }
      .tea-row .cup-stack[data-id="L"] {
        flex: 0 0 30px;
      }
      .tea-row .cup-stack[data-id="L"] svg {
        width: 30px;
        height: 60px;
      }
      /* Badge tồn của chồng ly: hạ xuống dưới mép dưới của tab QUẦY TRÀ (tab ghim ở góc
   trên-trái sẽ che badge nếu badge nằm ở top 2px như các nút khác). */
      .tea-row .cup-stack .badge {
        top: 24px;
      }
      /* Máy dán nắp: cao hơn bình (art lấp gần hết chiều cao hàng), neo đáy trên bệ. */
      .tea-row .sealer {
        flex: 0 0 48px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .tea-row .sealer-art svg {
        width: 100%;
        height: auto;
        max-height: none;
      }

      /* --- D) Khu pha: thùng rác góc trên-trái (cạnh tab PHA LY), thớt gỗ sáng --- */
      .brew-head {
        justify-content: flex-start;
      }
      .brew-head .bin {
        margin-left: 96px;
        width: 44px;
      }
      .board {
        background: linear-gradient(165deg, #f2d5a2, #e7bf85);
      }

      /* Khay topping: MỘT KHAY THÉP nguyên khối, ô VUÔNG LÕM xếp sát trong khay. */
      .topping-grid {
        background: linear-gradient(#eef1f4, #c9cfd6);
        border: 3px solid #98a1a9;
        border-radius: 14px;
        box-shadow:
          inset 0 2px 6px rgba(70, 50, 30, 0.22),
          0 1px 3px rgba(90, 55, 20, 0.18);
        gap: 5px;
        padding: 6px;
      }
      .topping-cell {
        background: linear-gradient(#f7f9fa, #dde2e6);
        border: 1.5px solid #a7b0b8;
        border-radius: 9px;
        box-shadow:
          inset 0 2px 5px rgba(70, 50, 30, 0.24),
          inset 0 -2px 3px rgba(255, 255, 255, 0.65);
      }
      /* Ô đang chọn (đã cho vào ly): viền HỒNG như ảnh gốc. */
      .topping-cell.in-cup {
        box-shadow:
          0 0 0 2.5px var(--accent),
          inset 0 2px 5px rgba(70, 50, 30, 0.24);
        border-radius: 9px;
      }
      /* Ô KHOÁ: mặt ô PHỦ KÍNH MỜ TRẮNG + ổ khoá VÀNG ở chính giữa. */
      .topping-cell.locked {
        background: linear-gradient(#fdfefd, #e9edea);
      }
      .topping-cell.locked::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        pointer-events: none;
      }
      .topping-cell.preview-locked .topping-art {
        opacity: 0.55;
        filter: grayscale(0.35);
      }
      /* .cell-lock-ico giữ position:absolute (inset 0) của v1.6 — chỉ nâng z-index trên lớp
   kính mờ ::after (z 1); .lock-ico là span thường trong ô nên cần position để z-index chạy. */
      .topping-cell .cell-lock-ico {
        z-index: 2;
      }
      .topping-cell .lock-ico {
        position: relative;
        z-index: 2;
      }
      .topping-cell .lock-ico svg {
        width: 24px;
        height: 24px;
        opacity: 1;
      }

      /* Hộp đá/đường: thùng kim loại là chính art; biển tên NHỎ NẰM DƯỚI hộp (chip giấy). */
      .mini-box {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 2px 0 0;
        gap: 0;
        justify-content: flex-end;
      }
      .mini-box.hint {
        border-color: transparent;
        box-shadow: 0 0 0 2.5px var(--accent);
        border-radius: 12px;
      }
      .mini-art {
        width: 58px;
      }
      .mini-art svg {
        width: 100%;
        height: auto;
      }
      .mini-label {
        background: #fff8ec;
        border: 1.5px solid #b7a98f;
        border-radius: 6px;
        padding: 1px 7px;
        margin-top: 1px;
      }
      .mini-lock {
        bottom: auto;
        top: 0;
      }

      /* --- A+E) Kệ hương trong HỘC GỖ TỐI lõm; tên vị là chip giấy sáng trên nền tối --- */
      .flavor-shelf {
        background: linear-gradient(180deg, #5d3a1e 0, #77502a 16%, #7c4f28 76%, #a06a34 77%, #8a5a2e 100%);
        border-top: 5px solid #4c2f16;
        border-radius: 8px;
        box-shadow:
          inset 0 12px 16px rgba(30, 15, 0, 0.45),
          inset 0 -4px 8px rgba(30, 15, 0, 0.3);
      }
      .flavor-section::after {
        background: linear-gradient(90deg, transparent, #77502a);
      }
      .flavor-bottle {
        text-align: center;
      }

      /* Ô topping là CONTAINER kích thước (container-type: size): art svg lấy bề ngang
   theo min(97% bề ngang ô, 84% bề cao ô) — hộp svg LUÔN giữ tỉ lệ 68×92 dù ô
   bị ép thấp ở 360×640 (trước đây max-height kẹp chiều cao mà bề ngang giữ nguyên
   -> audit viewbox báo méo). v1.8.0 sửa bổ sung: canvas topping đổi 68×60 -> 68×92
   (ô quầy cao hơn rộng; canvas thấp cũ làm khay ĐẦY chỉ lấp ~40% chiều cao ô) +
   BỎ trần 68px/76cqh cũ — texture nay PHỦ GẦN KÍN mặt ô: bề ngang ~97cqw, chiều
   cao suy ra = min(131cqw, 100cqh) (đúng công thức cửa sổ .topping-pile bên
   dưới, hai nơi phải khớp nhau). LƯU Ý: cq tính theo HỘP NỘI DUNG của ô.
   v1.9.0: trần bề ngang 74cqh -> 84cqh — ô topping ở 390x844 thấp đi (61px, vì
   tủ hương 2 hàng lấy thêm chiều cao) làm trần 74cqh bóp bề ngang art còn 83%
   cửa sổ khay; trần 84cqh cho art cao hơn cửa sổ đầy một chút (cửa sổ .topping-pile
   neo đáy + overflow hidden nên chỉ cắt phần đỉnh texture, mặt đống vẫn phủ kín
   ~95% bề ngang cửa sổ ở mức đầy). */
      .topping-cell {
        container-type: size;
      }
      .svc-main .topping-art svg {
        width: min(97cqw, 84cqh);
        height: auto;
        max-width: none;
        max-height: none;
      }

      /* Màn THẤP (<=719px): nén tỉ lệ art của hàng trà/khu pha theo cùng hệ số. */
      @media (max-height: 719px) {
        /* Màn thấp: nhân vật 20% (không phải 24%) — bong bóng cần bề ngang để dòng đơn
     2 ly không ngắt 3 dòng/dòng, giữ cụm khách gọn cho quầy bên dưới. */
        .customer-figure {
          flex-basis: 20%;
        }
        .speech-bubble {
          grid-template-columns: 30px minmax(0, 1fr);
        }
        .bubble-cup svg {
          width: 27px;
          height: 33px;
        }
        .tea-row .cup-stack[data-id="M"] {
          flex-basis: 24px;
        }
        .tea-row .cup-stack[data-id="M"] svg {
          width: 24px;
          height: 48px;
        }
        .tea-row .cup-stack[data-id="L"] {
          flex-basis: 28px;
        }
        .tea-row .cup-stack[data-id="L"] svg {
          width: 28px;
          height: 56px;
        }
        .tea-row .cup-stack .badge {
          top: 20px;
        }
        .tea-row .sealer {
          flex-basis: 40px;
        }
        .svc-main .tea-section {
          margin-top: 5px;
        }
        .tea-row .jar-label {
          top: 21%;
        }
        /* Tab PHA LY ở màn thấp: nâng lên ghim vào dải gỗ ranh giới 2 khu (top -9) để
     không che dòng chữ nhắc trên thớt (thớt bắt đầu ngay dưới mép khu pha). */
        .svc-main .brew-head .bin {
          margin-left: 0;
        }
        .mini-art {
          width: 34px;
        }
        .svc-main .mini-box {
          min-height: 48px;
        }
        /* Nén thêm cột trái khu pha ở màn thấp: thớt bớt padding/gap, biển tên đá/đường
     gọn lại — đủ cho hàng đá/đường không tràn xuống kệ hương ở ca chật nhất
     (demo Ngày 21, 360×640, audit overlap từng báo tràn 12px). */
        .svc-main .board {
          padding: 6px;
          gap: 4px;
        }
        .svc-main .ice-sugar {
          margin-top: 2px;
        }
        .mini-label {
          padding: 0 7px;
          line-height: 1.25;
        }
        /* Đợt nén thứ hai cho ca demo 360×640 (đo rect trực tiếp): tổng tối thiểu của cột
     trái (thớt sàn 44 + hàng đá/đường 65 vì biển "NƯỚC ĐƯỜNG" 2 dòng như ảnh gốc)
     vượt chiều cao lưới pha ~17px. Thu: sàn thớt 44->38 + bỏ margin-top chữ thớt,
     art đá/đường 34->26px, chồng ly L 56->52 + chip size gọn, margin tab trà 5->2,
     hàng đá/đường margin-top 0. Tổng ~20px. */
        .svc-main .board {
          min-height: 38px;
          padding: 4px 6px;
        }
        .svc-main .board-text {
          margin-top: 0;
        }
        .mini-art {
          width: 26px;
        }
        .svc-main .mini-art svg {
          width: 26px;
        }
        .tea-row .cup-stack[data-id="L"] {
          flex-basis: 26px;
        }
        .tea-row .cup-stack[data-id="L"] svg {
          width: 26px;
          height: 52px;
        }
        .cup-size {
          padding: 0;
          line-height: 1.2;
        }
        .svc-main .tea-section {
          margin-top: 2px;
        }
        .svc-main .ice-sugar {
          margin-top: 0;
        }
      }

      /* =====================================================================
   v1.8.0 — PHẢN HỒI USER SAU KHI CHƠI v1.7.0 (CHANGES-V18):
   1) cụm khách + bong bóng THU HẸP ~1 NỬA: đầu phục vụ chia 2 cột
      (trái 55% khách+bong bóng · phải 45% hàng đợi + Đóng cửa + lưới
      2×2 nút tắt — XOÁ hàng tab ngang toàn bề ngang cũ) ·
   2) chai hương BỎ chữ tên, nhãn là HÌNH TRÁI CÂY to/chi tiết ·
   3) khay topping ĐẦY/RỖNG theo tồn kho thật (.topping-pile theo --fill) ·
   4) nội thất + máy dán nắp + thớt vẽ lại 2.5D (khối, bóng, góc cạnh),
      máy XOÁ chữ READY -> đèn tín hiệu · 5) GỠ biển QUẦY TRÀ/PHA LY.
   ===================================================================== */

      /* Nhãn bình trà: nới line-height 1.15 -> 1.25 (audit UI v1.8 bắt lỗi chữ chật
   lh < fs x 1.19 ở nhãn 2 dòng như HỒNG TRÀ; nhãn là absolute nên không đổi layout). */
      .tea-row .jar-label {
        line-height: 1.25;
      }

      /* --- 1) Cụm đầu phục vụ 2 cột --- */
      .svc-head {
        display: grid;
        grid-template-columns: 55% 45%;
        align-items: start;
      }
      .svc-head-left {
        min-width: 0;
      }
      .svc-head-left .customer-area {
        padding: 2px 2px 4px 10px;
      }
      /* Khách nhỏ lại: figure tính theo bề ngang CỘT TRÁI (~15% khung) thay vì 27% khung. */
      .svc-head-left .customer-figure {
        flex-basis: 26%;
        max-width: 64px;
      }
      .svc-head-right {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 10px 4px 2px;
      }
      .svc-head-right .queue-row {
        padding: 0;
        flex-wrap: wrap;
        gap: 6px;
      }
      .svc-head-right .queue-empty {
        font-size: 12.5px;
        line-height: 1.35;
        padding-top: 12px;
      }
      .svc-close-row {
        display: flex;
      }
      .svc-head-right .btn-close-shop {
        margin: 0;
      }
      /* Công tắc Gợi ý chuyển từ đầu bong bóng sang cột phải (v1.8.0): bong bóng hẹp
   không còn chỗ cho hàng tên + công tắc 46px; công tắc là điều khiển PHIÊN nên
   đặt ở cột điều khiển phải là hợp lý, giữ nguyên data-hint-toggle + min-height. */
      .svc-side-tools {
        display: flex;
      }
      .svc-side-tools .hint-toggle {
        margin-left: 0;
        min-height: 44px;
      }
      .svc-shortcuts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .svc-shortcuts .sheet-tab {
        min-height: 46px;
        border-radius: 14px;
        padding: 3px 2px;
        width: 100%;
      }
      /* Bong bóng hẹp (~nửa khung): đầu bong bóng cho WRAP (tên khách rút ellipsis,
   công tắc Gợi ý xuống dòng khi chật) và chân bong bóng cho hàng KIÊN NHẪN trọn
   một dòng riêng (nhãn + thanh không bị nút Từ chối bóp mất), nút xuống dòng dưới. */
      .svc-head-left .bubble-head {
        flex-wrap: wrap;
        row-gap: 0;
      }
      .svc-head-left .customer-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .svc-head-left .bubble-foot {
        flex-wrap: wrap;
      }
      .svc-head-left .bubble-foot .patience-row {
        flex: 1 1 100%;
      }
      /* Trong bong bóng hẹp, hàng KIÊN NHẪN xếp DỌC: nhãn trên, thanh dưới trọn bề ngang
   bong bóng — để thanh kiên nhẫn dài/đọc rõ như bản gốc thay vì bị nhãn bóp còn vài px. */
      .svc-head-left .patience-row {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
      }
      .svc-head-left .patience-label {
        align-self: flex-start;
      }
      /* flex:1 của .patience-track đặt flex-basis 0% — ở hàng NGANG basis ăn theo bề
   ngang (đúng), nhưng hàng DỌC thì basis ăn theo chiều CAO làm thanh co về 0px:
   phải khoá flex: 0 0 auto + height tường minh ở bố cục dọc này. */
      .svc-head-left .patience-track {
        flex: 0 0 auto;
        width: 100%;
        height: 7px;
      }
      .svc-head-left .bubble-foot .bubble-actions {
        margin-left: auto;
      }
      /* Không còn tab gỗ ghim mép -> kệ trà không cần chừa margin cho tab nữa. */
      .svc-main .tea-section {
        margin-top: 3px;
      }
      /* Thùng rác về sát trái khu pha (hết biển PHA LY để né). */
      .brew-head .bin {
        margin-left: 2px;
      }

      /* --- 2) Chai hương: bỏ tên -> chai cao hơn trong cùng ô kệ, trái cây to hơn --- */
      .svc-main .bottle-art svg {
        height: 60px;
      }
      @media (max-height: 719px) {
        .svc-main .bottle-art svg {
          height: 42px;
        }
        .svc-head-right {
          gap: 3px;
          padding-top: 4px;
        }
        .svc-shortcuts .sheet-tab {
          min-height: 44px;
        }
      }

      /* --- 3) Khay topping đầy/rỗng theo tồn thật --- */
      /* .topping-pile = cửa sổ cắt đống topping, neo ĐÁY ô. Chiều cao cửa sổ =
   --fill × CHIỀU CAO ART ĐẦY (không phải chiều cao ô): art svg (canvas 68×92)
   rộng min(97cqw, 74cqh) -> cao = min(131cqw, 100cqh); cửa sổ tính đúng theo
   biểu thức đó nên mặt đống hạ xuống như khay thật khi tồn vơi; texture phủ
   kín diện tích art nên mức thấp vẫn là lớp topping phủ kín đáy ô; --fill: 0
   -> đống biến mất, ô trơ đáy thép. */
      .topping-pile {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 2px;
        height: calc(var(--fill, 1) * min(131cqw, 100cqh));
        overflow: hidden;
        border-radius: 0 0 7px 7px;
        pointer-events: none;
      }
      .topping-pile .topping-art {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: min(131cqw, 100cqh);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      /* Ô RỖNG (level 0): đáy thép lộ rõ (gradient thép sẫm hơn + bóng lõm sâu) +
   vết mờ topping còn sót ở đáy ô. */
      .topping-cell.fill-lv-0 {
        background: linear-gradient(#d5dade, #b7bec5);
        box-shadow:
          inset 0 3px 8px rgba(70, 50, 30, 0.38),
          inset 0 -2px 3px rgba(255, 255, 255, 0.5);
      }
      .topping-residue {
        display: none;
      }
      .topping-cell.fill-lv-0 .topping-residue {
        display: block;
        position: absolute;
        left: 20%;
        right: 20%;
        bottom: 6px;
        height: 7px;
        border-radius: 50%;
        background: var(--top-color);
        opacity: 0.3;
        filter: blur(1.2px);
        pointer-events: none;
      }

      /* --- 4a) Máy dán nắp: ĐÈN TÍN HIỆU thay chữ READY --- */
      /* Chấm đèn HTML đè đúng ổ đèn vẽ trong art (x45 y41 -> left 70,3% / top 38% của
   .sealer-art); xanh lá = sẵn sàng, cam = đã dán nắp. Không còn chữ nào. */
      .ready-light {
        left: 70.3%;
        top: 38%;
        right: auto;
        transform: translate(-50%, -50%);
        width: 11px;
        height: 11px;
        padding: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #c2f6cd, #57d977 58%, #2e7d3a);
        border: 1.5px solid #256b31;
        box-shadow:
          0 0 6px rgba(87, 217, 119, 0.85),
          inset 0 -2px 3px rgba(0, 0, 0, 0.25);
      }
      .ready-light.is-sealed {
        background: radial-gradient(circle at 35% 35%, #ffdfae, #f2994a 58%, #c96a1e);
        border-color: #a8541a;
        box-shadow:
          0 0 6px rgba(242, 153, 74, 0.85),
          inset 0 -2px 3px rgba(0, 0, 0, 0.25);
      }

      /* --- 4b) 2.5D: bệ kệ trà — mặt trên sáng + vân ván + cạnh bên phải + bóng đổ --- */
      .tea-row {
        background: repeating-linear-gradient(90deg, rgba(122, 75, 33, 0.08) 0 2px, transparent 2px 34px),
          linear-gradient(
            to top,
            #a9713a 0 10px,
            #7c4f28 10px 11.5px,
            #e9c48d 11.5px 14.5px,
            rgba(233, 196, 141, 0) 15px
          ),
          linear-gradient(180deg, #f2d5a2, #eac992);
        box-shadow:
          inset 0 2px 0 rgba(255, 246, 226, 0.75),
          inset -7px 0 0 rgba(90, 55, 20, 0.22),
          inset 3px 0 0 rgba(255, 246, 226, 0.35),
          0 5px 9px rgba(90, 55, 20, 0.3);
      }

      /* --- 4c) 2.5D: mặt bàn khu pha — mặt bàn gỗ sáng + cạnh trước ở đáy khu --- */
      .svc-main .brew-section {
        background: linear-gradient(
          180deg,
          rgba(255, 246, 226, 0.5),
          rgba(233, 196, 141, 0.16) 34%,
          rgba(169, 113, 58, 0.12)
        );
        box-shadow:
          inset 0 2px 0 rgba(255, 250, 238, 0.55),
          inset 0 -7px 0 rgba(169, 113, 58, 0.32);
        border-radius: 0 0 10px 10px;
      }

      /* --- 4d) 2.5D: THỚT — vân gỗ CHÌM (sọc thưa, mờ, chuyển mềm), cạnh thớt dày,
   RÃNH NƯỚC quanh mép. v1.8.0 sửa bổ sung: vân cũ là sọc dọc đậm đều nhau mỗi
   9px đọc như mành tre/cửa chớp — nay sọc cách ~33px, đậm tối đa .055 và loang
   mềm 2 đầu (không còn cạnh sọc sắc), chỉ còn là vệt vân gỗ mờ dưới mặt thớt. --- */
      .board {
        position: relative;
        background: repeating-linear-gradient(
            94deg,
            transparent 0 15px,
            rgba(146, 98, 44, 0.05) 21px,
            rgba(146, 98, 44, 0.018) 26px,
            transparent 33px
          ),
          repeating-linear-gradient(178deg, transparent 0 11px, rgba(255, 255, 255, 0.045) 15px, transparent 22px),
          linear-gradient(165deg, #f4d8a6, #e8c088);
        box-shadow:
          inset 0 2px 0 rgba(255, 248, 230, 0.8),
          inset 0 -8px 0 rgba(133, 84, 36, 0.55),
          inset 3px 0 0 rgba(255, 248, 230, 0.35),
          0 4px 7px rgba(90, 55, 20, 0.28);
      }
      .board::before {
        /* rãnh nước: vòng lõm chạy quanh mép trong của thớt thật */
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 9px;
        pointer-events: none;
        border: 2px solid rgba(133, 84, 36, 0.3);
        box-shadow:
          inset 0 1px 4px rgba(90, 55, 20, 0.35),
          0 1px 0 rgba(255, 248, 230, 0.5);
      }
      .board > * {
        position: relative;
      }
      /* Thanh đo rót thành RÃNH LÕM có bóng trong (thay dải phẳng cũ). */
      .board-meter {
        border: 1px solid rgba(90, 55, 20, 0.55);
        box-shadow:
          inset 0 2px 5px rgba(40, 20, 0, 0.55),
          0 1px 0 rgba(255, 248, 230, 0.45);
      }

      /* --- 4e) Khay thép topping + hộp đá/đường: thêm độ dày/bóng đổ --- */
      .topping-grid {
        box-shadow:
          inset 0 2px 6px rgba(70, 50, 30, 0.22),
          inset 0 -5px 0 rgba(110, 120, 130, 0.55),
          0 3px 6px rgba(90, 55, 20, 0.3);
      }
      .mini-art svg {
        filter: drop-shadow(0 3px 3px rgba(90, 55, 20, 0.3));
      }

      /* --- 4f) 2.5D: TỦ/HỘC hương — mặt trên tủ + 2 vách bên + bóng trên sàn hộc --- */
      .flavor-shelf {
        background: linear-gradient(
            90deg,
            rgba(24, 12, 0, 0.42) 0 9px,
            rgba(255, 220, 170, 0.1) 9px 12px,
            transparent 12px calc(100% - 12px),
            rgba(255, 220, 170, 0.06) calc(100% - 12px) calc(100% - 9px),
            rgba(24, 12, 0, 0.42) calc(100% - 9px)
          ),
          linear-gradient(
            180deg,
            #c99a58 0 5px,
            #8a5a2e 5px 9px,
            #5d3a1e 9px,
            #77502a 22%,
            #7c4f28 76%,
            #a06a34 77%,
            #8a5a2e 100%
          );
        box-shadow:
          inset 0 12px 16px rgba(30, 15, 0, 0.45),
          inset 0 -4px 8px rgba(30, 15, 0, 0.3),
          0 -3px 6px rgba(90, 55, 20, 0.25);
      }

      /* =====================================================================
   v1.9.0 — USER ĐÍNH CHÍNH HƯỚNG "HẸP" CỦA v1.8 (CHANGES-V19):
   "hẹp" = nén theo TRỤC Y (chiều cao), KHÔNG phải bề ngang.
   1) Cụm khách KÉO DÀI FULL BỀ NGANG + nén chiều cao: bỏ chia 2 cột
      55/45 (markup .svc-head-left/right đã gỡ); khách nhỏ gọn bên trái,
      bong bóng trải hết bề ngang còn lại — chữ ít ngắt dòng nên bong
      bóng thấp hơn hẳn. Hàng đợi + Đóng cửa + Gợi ý + 4 nút tắt gom vào
      MỘT HÀNG TIỆN ÍCH MỎNG (.svc-utility ~44–48px) dưới cụm khách.
   2) TỦ HƯƠNG nhận phần chiều cao dôi ra: kệ 2 HÀNG × 6 CHAI, BỎ cuộn
      ngang (12 chai luôn thấy đủ), chai TO lên (art 60 -> 84px ở màn
      cao, 42 -> 52px ở màn thấp) và SÁT nhau hơn (gap 8 -> 5px).
   ===================================================================== */

      /* --- 1a) Bỏ chia cột: .svc-head về một cột dọc full bề ngang --- */
      .svc-head {
        display: block;
      }
      /* Mái hiên mỏng thêm 2px (14 -> 12, bằng mức màn thấp) cho ngân sách trục Y. */
      .awning {
        height: 12px;
      }
      .svc-head .customer-area {
        padding: 2px 10px 3px;
      }
      /* Khách nhỏ gọn: figure 60px -> cao ~66px (viewBox 120x132, tỉ lệ 1,1). */
      .svc-head .customer-figure {
        flex-basis: 60px;
        max-width: 60px;
      }
      /* Bong bóng nén chiều cao: padding gọn; chân bong bóng 1 hàng ngang như v1.6
   (KIÊN NHẪN nhãn + thanh cùng hàng với nút Từ chối/Hết món ở .bubble-foot). */
      .svc-head .speech-bubble {
        padding: 4px 8px;
      }
      .svc-head .bubble-foot {
        margin-top: 2px;
        flex-wrap: nowrap;
      }
      .svc-head .bubble-foot .patience-row {
        flex: 1 1 auto;
        min-width: 0;
      }
      .svc-head .patience-track {
        height: 7px;
      }

      /* --- 1b) Hàng tiện ích mỏng: hàng đợi trái · công cụ phải dạng chip --- */
      .svc-utility {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px 1px;
      }
      .svc-utility-queue {
        flex: 0 1 auto;
        min-width: 0;
      }
      .svc-utility-queue .queue-row {
        padding: 0;
        gap: 6px;
        flex-wrap: nowrap;
      }
      .svc-utility-queue .queue-avatar {
        width: 44px;
        height: 44px;
        flex: 0 1 44px;
      }
      .svc-utility-queue .queue-avatar .ring {
        width: 100%;
        height: 100%;
      }
      .svc-utility-queue .queue-empty {
        font-size: 12px;
        white-space: nowrap;
      }
      .svc-utility-tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .svc-utility-tools .btn-close-shop {
        margin: 0;
      }
      .svc-utility-tools .hint-toggle {
        margin-left: 0;
        min-height: 44px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .svc-utility .svc-shortcuts {
        display: flex;
        gap: 5px;
      }
      .svc-utility .svc-shortcuts .sheet-tab {
        flex: 0 0 auto;
        width: auto;
        min-width: 44px;
        min-height: 44px;
        padding: 2px 7px;
        border-radius: 999px;
      }
      /* Icon chip nhỏ lại để nội dung chip (icon + nhãn xếp dọc) vừa đúng 44px thay vì 46px. */
      .svc-utility .tab-ico {
        font-size: 15px;
        line-height: 1.2;
      }
      /* Màn hẹp (<=380px): chip + công tắc siết padding/gap để hàng tiện ích không tràn. */
      @media (max-width: 380px) {
        .svc-utility {
          gap: 6px;
        }
        .svc-utility-tools {
          gap: 4px;
        }
        .svc-utility .svc-shortcuts {
          gap: 4px;
        }
        .svc-utility .svc-shortcuts .sheet-tab {
          padding: 2px 4px;
        }
      }

      /* --- 2) TỦ HƯƠNG: 2 hàng × 6 chai, bỏ cuộn ngang, chai to + sát nhau --- */
      /* Hết cuộn ngang -> bỏ mép mờ gợi ý "còn chai phía sau" ở mép phải tủ. */
      .flavor-section::after {
        display: none;
      }
      .flavor-shelf {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 5px;
        overflow: visible;
        scrollbar-width: none;
        padding: 8px 8px 5px;
        /* Nền tủ 2 tầng: thêm VÁN KỆ GIỮA ở 50% (bóng dưới ván + mép sáng + mặt ván)
     trên nền hộc 2.5D của v1.8; mép sàn tủ dời xuống sát đáy (100% - 10px)
     thay cho mốc 76% của kệ 1 hàng. */
        background: linear-gradient(
            180deg,
            transparent calc(50% - 4px),
            rgba(30, 15, 0, 0.38) calc(50% - 4px),
            rgba(30, 15, 0, 0.38) calc(50% - 2px),
            rgba(255, 220, 170, 0.3) 50%,
            rgba(122, 79, 40, 0.95) calc(50% + 3px),
            transparent calc(50% + 6px)
          ),
          linear-gradient(
            90deg,
            rgba(24, 12, 0, 0.42) 0 9px,
            rgba(255, 220, 170, 0.1) 9px 12px,
            transparent 12px calc(100% - 12px),
            rgba(255, 220, 170, 0.06) calc(100% - 12px) calc(100% - 9px),
            rgba(24, 12, 0, 0.42) calc(100% - 9px)
          ),
          linear-gradient(
            180deg,
            #c99a58 0 5px,
            #8a5a2e 5px 9px,
            #5d3a1e 9px,
            #77502a 22%,
            #7c4f28 calc(100% - 12px),
            #a06a34 calc(100% - 10px),
            #8a5a2e 100%
          );
      }
      .flavor-bottle {
        width: auto;
      }
      /* Chai TO lên: art 84px (v1.8: 60px, +40%) — nhãn trái cây to theo, rõ hơn hẳn.
   Min-height ô chai 92px (art 84 + 8px thoáng) — chừa lại chút chiều cao cho khu pha. */
      .svc-main .flavor-bottle {
        min-height: 92px;
      }
      .svc-main .bottle-art svg {
        height: 84px;
      }
      .svc-main .bottle-lock-ico {
        top: 32px;
      }

      /* Màn THẤP (<=719px): khách nhỏ hơn; chai vẫn to hơn v1.8 (42 -> 52px, +24%)
   trong giới hạn không cuộn — ưu tiên giữ cổng không cuộn của v16-check. */
      @media (max-height: 719px) {
        .svc-head .customer-figure {
          flex-basis: 54px;
          max-width: 54px;
        }
        .svc-main .flavor-bottle {
          min-height: 60px;
        }
        .svc-main .bottle-art svg {
          height: 52px;
        }
        .svc-main .bottle-lock-ico {
          top: 20px;
        }
        .flavor-shelf {
          padding: 5px 8px 3px;
        }
      }

      /* =====================================================================
   v1.10.0 — VÁ AUDIT iOS (CHANGES-V110):
   B4) safe-area cho CTA Chuẩn bị / vùng cuộn các pha / toast / overlay ·
   B5) bottom-sheet tránh bàn phím qua biến --kb (visualViewport, frame.js) ·
   B6) HƯỚNG 2: hàng trà giảm đệm ngang + nới chồng ly (vẫn 1 hàng, không cuộn) ·
   B7) guard xoay ngang · B11) touch-action + chặn callout/selection trong khung.
   ===================================================================== */

      /* --- B4: safe-area inset cho các vùng còn thiếu --- */
      .prep-cta {
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }
      .phase-scroll {
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
      }
      .toast {
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
      .theme-overlay,
      .pause-overlay,
      .guide-overlay,
      .confirm-overlay {
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }

      /* --- B5: sheet nổi lên trên bàn phím (frame.js cập nhật --kb từ visualViewport) --- */
      .sheet-overlay {
        padding-bottom: var(--kb, 0px);
      }

      /* --- B6 HƯỚNG 2: đệm ngang khu trà 10px -> 4px; chồng ly M 26->36px, L 30->38px
   (chiều cao nút đã >=56px; bề ngang vẫn <44px — số đo cuối ghi ở CHANGES-V110). --- */
      .svc-main .tea-section {
        padding-left: 4px;
        padding-right: 4px;
      }
      .tea-row .cup-stack[data-id="M"] {
        flex-basis: 36px;
      }
      .tea-row .cup-stack[data-id="L"] {
        flex-basis: 38px;
      }
      @media (max-height: 719px) {
        .tea-row .cup-stack[data-id="M"] {
          flex-basis: 32px;
        }
        .tea-row .cup-stack[data-id="L"] {
          flex-basis: 34px;
        }
      }

      /* --- B7: lớp phủ nhắc xoay dọc — chỉ hiện khi ngang + màn thấp (CSS quyết định
   hiển thị; JS matchMedia lo phần tự Tạm dừng khi đang phục vụ). --- */
      .rotate-guard {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 80;
        background: var(--overlay-bg);
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }
      .rotate-guard-card {
        background: var(--surface);
        color: var(--text-main);
        border: 2.5px solid var(--border);
        border-radius: 20px;
        padding: 18px 20px;
        max-width: 320px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(60, 35, 25, 0.35);
      }
      .rotate-guard-title {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
      }
      .rotate-guard-text {
        margin: 6px 0 0;
        font-size: 14px;
        line-height: 1.45;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .rotate-guard {
          display: flex;
        }
      }

      /* =====================================================================
   PHA C — SỬA THEO QA-V110 (tự chơi + đọc ảnh 390×844 / 360×640):
   C1) thanh trên chen chúc: cụm trái 215px bóp cụm giữa còn 21–51px -> tên tiệm
       bị cắt còn "Tiệ..." và tiền tràn sang đè chữ đánh giá ở late-game.
   C2) bong bóng "Đang chờ khách" bị kẹt cột 38px (rule --wide bị ghi đè).
   C4) nén Chuẩn bị ở màn thấp · C6) chân sheet Kho: tổng tiền tự vỡ 3 dòng.
   ===================================================================== */
      .topbar {
        gap: 5px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .topbar-left {
        gap: 5px;
      }
      .day-label {
        font-size: 15.5px;
      }
      .shop-name {
        font-size: 12px;
      }
      .money {
        font-size: 22px;
      }
      .rating-text {
        font-size: 12px;
      } /* giữ >= 12px: dưới mức này ui-audit minFont báo lỗi */
      @media (max-width: 380px) {
        /* Màn hẹp: bỏ hậu tố "đánh giá" (số sao + số lượng vẫn đủ) và ẩn hàng sao tượng
     trưng (điểm số chữ vẫn hiện) để cụm giữa có đủ chỗ cho tên tiệm + tiền. */
        .rating-suffix {
          display: none;
        }
        .topbar-right .stars {
          display: none;
        }
        .day-label {
          font-size: 14.5px;
        }
        .money {
          font-size: 21px;
        }
      }
      /* C3: thẻ hướng dẫn ở pha Tổng kết nay nằm ở ĐÁY an toàn (khỏi che tiêu đề + dòng
   Doanh thu/Lãi ở đầu bảng) — bù lại vùng cuộn Tổng kết được cộng đệm đáy khi thẻ
   đang hiện, để nút "Ngày tiếp theo" (cuối nội dung) cuộn lên khỏi thẻ được. */
      #app-frame:has(#tutorial-overlay .tut-card) .summary-scroll {
        padding-bottom: 200px;
      }
      /* C2: bong bóng chờ khách (không có cột ly mini) phải trải full bề ngang — rule
   --wide cũ (specificity 0,1,0) bị rule .speech-bubble của v1.7 (khai báo sau)
   ghi đè mất; nâng specificity để thắng chắc chắn. */
      .speech-bubble.speech-bubble--wide {
        grid-template-columns: 1fr;
      }
      /* C6: chân sheet — tổng tiền không tự vỡ dòng; nút xuống hàng khi chật. */
      .sheet-foot {
        flex-wrap: wrap;
      }
      .sheet-total {
        white-space: nowrap;
      }
      /* C4: màn thấp — nén nhẹ các khối ở Chuẩn bị để bớt phải cuộn (số đo ở QA-V110). */
      @media (max-height: 719px) {
        .tut-card {
          padding: 7px 10px;
        }
        .tut-card-text {
          line-height: 1.35;
        }
        .menu-chalk {
          padding: 7px 10px;
        }
        .menu-chalk .sum-row,
        .forecast-block .sum-row {
          padding-top: 4px;
          padding-bottom: 4px;
        }
        .shop-sign {
          padding: 6px 12px;
          margin-bottom: 6px;
        }
        .prep-block {
          margin-bottom: 6px;
        }
      }

      /* --- B11: thao tác chạm — không delay 300ms, không callout/bôi đen trong khung
   game; riêng ô nhập vẫn chọn chữ được như thường. --- */
      html {
        touch-action: manipulation;
      }
      #app-frame {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app-frame input,
      #app-frame textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* =====================================================================
   v1.11.0 — PHẢN HỒI UI CỦA USER SAU v1.10 (CHANGES-V111):
   1) độ dài thẻ con THỐNG NHẤT trong các sheet + 2) Trang bị căn trái ·
   3) hiệu ứng đóng/mở sheet + popup · 5) tủ hương về 1 hàng cuộn ngang ·
   6) nới khu pha + ly M/L to lên · 7) topping vơi theo từng hạt ·
   8) ly bỏ vào hàng Đá/Đường + giữ 3 giây.
   ===================================================================== */

      /* --- 1+2) Sheet: MỘT chiều cao cố định cho mọi thẻ item; khối chữ flex:1 căn
   TRÁI (trước đây .sheet-row-main không có flex nên bị space-between đẩy ra
   giữa tuỳ độ dài chữ — 5 item Trang bị đầu mainLeft 93–105px so với 52px của
   các item chữ dài bên dưới); nút hành động neo phải, thẳng hàng mọi thẻ. --- */
      .sheet-row {
        height: 84px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .sheet-row-main {
        flex: 1 1 auto;
        justify-content: center;
        text-align: left;
      }
      /* Dòng sổ cố định 44px — chỉ trong SHEET và màn TỔNG KẾT pha (không áp cho
   bảng Menu hôm nay/dự báo ở Chuẩn bị: các khối đó đã nén riêng theo QA C4). */
      .sheet-body .sum-row,
      .summary-scroll .sum-row {
        height: 44px;
        align-items: center;
        padding-top: 0;
        padding-bottom: 0;
      }
      .sheet-body .sum-row.wrap,
      .summary-scroll .sum-row.wrap {
        height: auto;
        min-height: 44px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .sheet-body .sum-row.sum-total,
      .summary-scroll .sum-row.sum-total {
        height: 54px;
      }
      .sheet-body .loan-block .sum-row {
        height: 62px;
      } /* dòng vay có nút Trả nợ (nút cao 46px) */
      /* Đánh giá (trong sheet): thẻ review cao cố định 196px; chữ review kẹp 2 dòng,
   phản hồi quán kẹp 3 dòng (dòng 1 = nhãn) để nội dung dài không phá khung;
   đang sửa phản hồi (có ô nhập) thì thẻ giãn tự do. */
      .sheet-body .review-row {
        height: 196px;
        overflow: hidden;
      }
      .sheet-body .review-row:has(.reply-edit-box) {
        height: auto;
        overflow: visible;
      }
      .sheet-body .review-text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .sheet-body .review-row .rv-reply {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* --- 3) Hiệu ứng đóng/mở UI: sheet trượt lên + mờ dần (~240ms mở / 200ms
   đóng), popup/hộp thoại pop nhẹ + mờ dần. JS (frame.js) gắn .ui-closing khi
   đóng rồi mới ẩn hẳn; prefers-reduced-motion -> tắt toàn bộ. --- */
      @keyframes v111-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes v111-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes v111-sheet-in {
        from {
          transform: translateY(34px);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes v111-sheet-out {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(34px);
        }
      }
      @keyframes v111-pop-in {
        from {
          transform: translateY(12px) scale(0.96);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
      @keyframes v111-pop-out {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(10px) scale(0.97);
        }
      }
      .sheet-overlay:not([hidden]) {
        animation: v111-fade-in 0.22s ease-out;
      }
      .sheet-overlay:not([hidden]) .sheet-card {
        animation: v111-sheet-in 0.24s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .sheet-overlay.ui-closing {
        animation: v111-fade-out 0.2s ease-in forwards;
      }
      .sheet-overlay.ui-closing .sheet-card {
        animation: v111-sheet-out 0.2s ease-in forwards;
      }
      .confirm-overlay:not([hidden]),
      .pause-overlay:not([hidden]),
      .theme-overlay:not([hidden]),
      .guide-overlay:not([hidden]) {
        animation: v111-fade-in 0.2s ease-out;
      }
      .confirm-overlay:not([hidden]) .confirm-card,
      .pause-overlay:not([hidden]) .pause-card,
      .theme-overlay:not([hidden]) .theme-card,
      .guide-overlay:not([hidden]) .guide-card {
        animation: v111-pop-in 0.22s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .confirm-overlay.ui-closing,
      .pause-overlay.ui-closing,
      .theme-overlay.ui-closing,
      .guide-overlay.ui-closing {
        animation: v111-fade-out 0.18s ease-in forwards;
      }
      .confirm-overlay.ui-closing .confirm-card,
      .pause-overlay.ui-closing .pause-card,
      .theme-overlay.ui-closing .theme-card,
      .guide-overlay.ui-closing .guide-card {
        animation: v111-pop-out 0.18s ease-in forwards;
      }
      .result-panel:not([hidden]) {
        animation: v111-pop-in 0.22s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      /* Đang đóng (mờ dần) thì không chặn chạm — thao tác của người chơi xuyên qua. */
      .sheet-overlay.ui-closing,
      .confirm-overlay.ui-closing,
      .pause-overlay.ui-closing,
      .theme-overlay.ui-closing,
      .guide-overlay.ui-closing {
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet-overlay,
        .sheet-card,
        .confirm-overlay,
        .confirm-card,
        .pause-overlay,
        .pause-card,
        .theme-overlay,
        .theme-card,
        .guide-overlay,
        .guide-card,
        .result-panel {
          animation: none !important;
        }
      }

      /* --- 5) TỦ HƯƠNG VỀ 1 HÀNG cuộn ngang (đảo ngược v1.9): bỏ lưới 2×6 + ván
   kệ giữa; chai đứng 1 hàng trên sàn hộc gỗ như v1.8, mép phải mờ gợi ý cuộn. --- */
      .flavor-section::after {
        display: block;
      }
      .flavor-shelf {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        padding: 8px 10px 5px;
        scrollbar-width: none;
        background: linear-gradient(
            90deg,
            rgba(24, 12, 0, 0.42) 0 9px,
            rgba(255, 220, 170, 0.1) 9px 12px,
            transparent 12px calc(100% - 12px),
            rgba(255, 220, 170, 0.06) calc(100% - 12px) calc(100% - 9px),
            rgba(24, 12, 0, 0.42) calc(100% - 9px)
          ),
          linear-gradient(
            180deg,
            #c99a58 0 5px,
            #8a5a2e 5px 9px,
            #5d3a1e 9px,
            #77502a 22%,
            #7c4f28 76%,
            #a06a34 77%,
            #8a5a2e 100%
          );
      }
      .flavor-shelf::-webkit-scrollbar {
        display: none;
      }
      .flavor-bottle {
        flex: 0 0 auto;
        width: 56px;
      }
      .svc-main .flavor-bottle {
        min-height: 80px;
      }
      .svc-main .bottle-art svg {
        height: 68px;
      }
      .svc-main .bottle-lock-ico {
        top: 24px;
      }

      /* --- 6) Ly M/L TO lên nhờ chiều cao dôi ra từ tủ hương 1 hàng; thớt cao hơn --- */
      .tea-row .cup-stack[data-id="M"] {
        flex-basis: 44px;
      }
      .tea-row .cup-stack[data-id="M"] svg {
        width: 34px;
        height: 68px;
      }
      .tea-row .cup-stack[data-id="L"] {
        flex-basis: 48px;
      }
      .tea-row .cup-stack[data-id="L"] svg {
        width: 40px;
        height: 80px;
      }
      .tea-row .sealer {
        flex-basis: 54px;
      }
      .tea-row .tea-jar {
        min-height: 64px;
      }
      .svc-main .board-cup {
        height: 60px;
      }

      /* --- 7) Ô topping = TỪNG HẠT: lớp hạt phủ trọn ô (không còn cửa sổ cắt) --- */
      .topping-particles {
        position: absolute;
        inset: 2px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* --- 8) Hàng Đá/Đường/Bỏ ly: 3 ô trong cột trái khu pha; hộp đá/đường thu
   nhỏ art; ô bỏ ly có VÒNG TIẾN TRÌNH giữ 3 giây quanh hình xô. --- */
      .ice-sugar {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
      }
      .mini-art {
        width: 32px;
      }
      .mini-label {
        padding: 1px 3px;
      }
      .bin-box {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      .bin-art {
        position: relative;
        display: block;
        width: 32px;
      }
      .bin-art > svg:not(.bin-ring) {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 3px 3px rgba(90, 55, 20, 0.3));
      }
      .bin-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 40px;
        transform: translate(-50%, -50%) rotate(-90deg);
        pointer-events: none;
      }
      .bin-ring circle {
        fill: none;
        stroke-width: 3.4;
      }
      .bin-ring-track {
        stroke: rgba(122, 75, 33, 0.16);
      }
      .bin-ring-fg {
        stroke: #d35450;
        stroke-linecap: round;
        stroke-dasharray: 119.4;
        stroke-dashoffset: 119.4;
      }
      .bin-box.holding .bin-ring-fg {
        transition: stroke-dashoffset 3s linear;
        stroke-dashoffset: 0;
      }
      .bin-box.holding {
        box-shadow: 0 0 0 2.5px #d35450;
        border-radius: 12px;
      }

      /* Màn RỘNG (>=410px, vd 430x932): phần bề ngang dôi ra trả lại cho 6 bình trà
   (gap 2->1px, máy dán nắp 54->46px) để bình đạt >= 44px bề ngang như v1.10,
   thay vì 43px do ly M/L + máy to lên ăn phần. Không ảnh hưởng 360/390px. */
      @media (min-width: 410px) {
        .tea-row {
          gap: 1px;
        }
        .tea-row .sealer {
          flex-basis: 46px;
        }
      }

      /* Màn THẤP (<=719px): tủ 1 hàng gọn hơn; ly vẫn to hơn v1.10; brew-head đã gỡ
   nên khu pha về 1 cột dọc (không còn cột thùng rác 46px ăn bề ngang lưới). */
      @media (max-height: 719px) {
        .svc-main .brew-section {
          flex-direction: column;
        }
        .flavor-shelf {
          gap: 6px;
          padding: 5px 8px 3px;
        }
        .flavor-bottle {
          width: 50px;
        }
        .svc-main .flavor-bottle {
          min-height: 62px;
        }
        .svc-main .bottle-art svg {
          height: 48px;
        }
        .svc-main .bottle-lock-ico {
          top: 16px;
        }
        .tea-row .cup-stack[data-id="M"] {
          flex-basis: 38px;
        }
        .tea-row .cup-stack[data-id="M"] svg {
          width: 28px;
          height: 56px;
        }
        .tea-row .cup-stack[data-id="L"] {
          flex-basis: 42px;
        }
        .tea-row .cup-stack[data-id="L"] svg {
          width: 32px;
          height: 64px;
        }
        .tea-row .sealer {
          flex-basis: 46px;
        }
        .svc-main .board-cup {
          height: 44px;
        }
        .mini-art {
          width: 26px;
        }
        .bin-art {
          width: 26px;
        }
        .bin-ring {
          width: 36px;
          height: 36px;
        }
      }
    </style>
